# Separate, unshipped workspace for cargo-fuzz targets.
# libfuzzer-sys (C++ libFuzzer) is allowed here only: docs/decisions/0002.
[package]
name = "usgp-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]
members = ["."]

[dependencies]
libfuzzer-sys = "0.4"
serde = "1"
serde_json = "1"
# `test-pki` (test certificate hierarchy) is test-only; the fuzz workspace
# is never shipped (decision 0002). `relay_boot_policy` uses it for the
# relay's TLS client settings, which `BootPolicyFeed` needs but never uses
# in the target (no network I/O).
usgp-crypto = { path = "../crates/usgp-crypto", features = ["test-pki"] }
usgp-dhcp = { path = "../crates/usgp-dhcp" }
# M3 (plan WU-14): GPT read-back and UEFI boot-option parsing.
usgp-disk = { path = "../crates/usgp-disk" }
# `testkit` (WIM builder, XPRESS test encoder) is test-only; the fuzz
# workspace is never shipped (decision 0002), so it may enable it for seeds
# and the round-trip mode of `xpress_chunk`.
usgp-image = { path = "../crates/usgp-image", features = ["testkit"] }
usgp-proto = { path = "../crates/usgp-proto" }
usgp-tftp = { path = "../crates/usgp-tftp" }
# M3 (plan WU-14): the relay's boot-policy feed and feed URL parser, used
# through its library target only (no sockets are opened).
usgp-relay = { path = "../services/usgp-relay" }
# M3 fix round 1 (NIST-011): the agent's HTTP response-head parser, through
# its library target only (no sockets are opened; off Windows the library
# carries the simulated platform, which the fuzz workspace never runs).
usgp-preboot-agent = { path = "../services/usgp-preboot-agent" }
# SEC-004: usgp-winapi's OS-neutral `parse` checks with the synthetic
# layouts of `parse-testkit` (test and fuzz only; never in a release build).
usgp-winapi = { path = "../crates/usgp-winapi", features = ["parse-testkit"] }

