# DISM sample WIM generation and observation (plan WU-W, decision 0006).
#
# generate        Windows: build samples S01-S07 and S09 from our own
#                 generated content with Microsoft's DISM, dump their
#                 structure, scan for the clean-room name, upload the
#                 artifact "wim-samples" (14-day retention, never committed).
# generate-large  Windows, manual runs only: S08 (one 4.5 GiB file) for the
#                 chunk-table width question; uploads text observations only,
#                 the WIM is deleted on the runner.
# verify          Linux: our parser against the artifact of the same run
#                 (crates/usgp-image/tests/dism_samples.rs, owned by WU-5).
#
# Samples are generated here and never downloaded from anywhere else
# (decision 0006 item 3). The licence question for DISM-made test files is
# open with counsel (plan Q7, OPEN-PE-LIC); hence short retention and no
# commit.
#
# Result rule (as ci.yml): a step that could not do its work fails; nothing
# that did not run is reported as PASS.
#
# COMPLIANCE MAPPING:
# - NIST 800-53: SA-11 (Developer Testing and Evaluation), SR-4 (Provenance),
#   SI-7 (image integrity checks tested against tool-made files)
# - SPEC: specs/standards/wim.md section 13; specs/standards/wim-compression.md
#   section 7; specs/os-images.md REQ-IMG-042
# - Decisions 0006, 0014
name: wim-samples

on:
  workflow_dispatch:
    inputs:
      large:
        description: Also build S08 (4.5 GiB source; observations only)
        type: boolean
        default: true
  push:
    branches: [main, m2-wim-samples]
    paths:
      - scripts/wim-samples/**
      - .github/workflows/wim-samples.yml
      - crates/usgp-image/**
      - Cargo.lock
  pull_request:
    paths:
      - scripts/wim-samples/**
      - .github/workflows/wim-samples.yml
      - crates/usgp-image/**
      - Cargo.lock

permissions:
  contents: read

concurrency:
  group: wim-samples-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Same FIPS build settings as ci.yml (decision 0001).
  AWS_LC_FIPS_SYS_USE_SYSTEM: "0"
  AWS_LC_SYS_USE_SYSTEM: "0"
  AWS_LC_FIPS_SYS_STATIC: "1"

jobs:
  generate:
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build samples S01-S07, S09 (DISM, /English, every command logged)
        id: build
        run: |
          ./scripts/wim-samples/Build-Samples.ps1 `
            -OutDir (Join-Path $env:RUNNER_TEMP 'wim-samples') `
            -WorkDir (Join-Path $env:RUNNER_TEMP 'wim-work') `
            -Set Standard
      - name: Name scan of the artifact (clean-room rule 5; as CR-303)
        # Runs even when the build failed, so partial evidence can be
        # uploaded; the upload runs only after a clean scan.
        # Paths and contents; contents as Latin-1 and as UTF-16LE at both
        # byte alignments (the WIM XML is UTF-16). The bracketed pattern
        # keeps this file from matching itself. Exit 1 on a hit, 2 if the
        # directory is missing.
        id: names
        if: ${{ !cancelled() }}
        env:
          SCAN_DIR: ${{ runner.temp }}/wim-samples
        run: |
          if (-not (Test-Path -LiteralPath $env:SCAN_DIR)) {
            Write-Output "::error::$env:SCAN_DIR does not exist"
            exit 2
          }
          $rx = [regex]::new('tan[i]um', [System.Text.RegularExpressions.RegexOptions]::IgnoreCase)
          $hits = @()
          foreach ($f in @(Get-ChildItem -LiteralPath $env:SCAN_DIR -Recurse -File)) {
            $b = [System.IO.File]::ReadAllBytes($f.FullName)
            $texts = @($f.Name, [System.Text.Encoding]::Latin1.GetString($b), [System.Text.Encoding]::Unicode.GetString($b))
            if ($b.Length -gt 1) { $texts += [System.Text.Encoding]::Unicode.GetString($b, 1, $b.Length - 1) }
            if (@($texts | Where-Object { $rx.IsMatch($_) }).Count -ne 0) { $hits += $f.Name }
          }
          if ($hits.Count -ne 0) {
            Write-Output "::error::clean-room name found in: $($hits -join ', ')"
            exit 1
          }
          Write-Output "name scan: OK"
      - name: Record the manifest in the job summary
        if: ${{ !cancelled() }}
        run: |
          $m = Join-Path $env:RUNNER_TEMP 'wim-samples\manifest.tsv'
          $lines = @('### wim-samples manifest', '```text')
          if (Test-Path -LiteralPath $m) { $lines += Get-Content -LiteralPath $m } else { $lines += 'manifest.tsv missing' }
          $lines += '```'
          $lines | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
      - name: Upload the samples and observations (14 days; never committed)
        if: ${{ !cancelled() && steps.names.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wim-samples
          path: ${{ runner.temp }}/wim-samples/
          if-no-files-found: error
          retention-days: 14

  generate-large:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.large }}
    runs-on: windows-2025
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build S08 (4.5 GiB pseudorandom file, /Compress:fast) and dump it
        id: build
        run: |
          ./scripts/wim-samples/Build-Samples.ps1 `
            -OutDir (Join-Path $env:RUNNER_TEMP 'wim-samples-large') `
            -WorkDir (Join-Path $env:RUNNER_TEMP 'wim-work-large') `
            -Set Large
      - name: Check that no sample file is in the upload directory
        if: ${{ !cancelled() }}
        run: |
          $d = Join-Path $env:RUNNER_TEMP 'wim-samples-large'
          $bad = @(Get-ChildItem -LiteralPath $d -File | Where-Object { $_.Extension -in '.wim', '.swm', '.esd' })
          if ($bad.Count -ne 0) {
            Write-Output "::error::sample files in the large observation upload: $($bad.Name -join ', ')"
            exit 1
          }
      - name: Name scan of the observations (clean-room rule 5; as CR-303)
        # Paths and contents; contents as Latin-1 and as UTF-16LE at both
        # byte alignments (the WIM XML is UTF-16). The bracketed pattern
        # keeps this file from matching itself. Exit 1 on a hit, 2 if the
        # directory is missing.
        id: names
        if: ${{ !cancelled() }}
        env:
          SCAN_DIR: ${{ runner.temp }}/wim-samples-large
        run: |
          if (-not (Test-Path -LiteralPath $env:SCAN_DIR)) {
            Write-Output "::error::$env:SCAN_DIR does not exist"
            exit 2
          }
          $rx = [regex]::new('tan[i]um', [System.Text.RegularExpressions.RegexOptions]::IgnoreCase)
          $hits = @()
          foreach ($f in @(Get-ChildItem -LiteralPath $env:SCAN_DIR -Recurse -File)) {
            $b = [System.IO.File]::ReadAllBytes($f.FullName)
            $texts = @($f.Name, [System.Text.Encoding]::Latin1.GetString($b), [System.Text.Encoding]::Unicode.GetString($b))
            if ($b.Length -gt 1) { $texts += [System.Text.Encoding]::Unicode.GetString($b, 1, $b.Length - 1) }
            if (@($texts | Where-Object { $rx.IsMatch($_) }).Count -ne 0) { $hits += $f.Name }
          }
          if ($hits.Count -ne 0) {
            Write-Output "::error::clean-room name found in: $($hits -join ', ')"
            exit 1
          }
          Write-Output "name scan: OK"
      - name: Upload the S08 observations (text only; 14 days)
        if: ${{ !cancelled() && steps.names.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wim-samples-large-observations
          path: ${{ runner.temp }}/wim-samples-large/
          if-no-files-found: error
          retention-days: 14

  verify:
    # Consumer contract: scripts/wim-samples/README.md, "Linux consumer".
    needs: generate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require the WU-5 consumer (absent is NOT RUN, which fails)
        run: |
          set -euo pipefail
          if [ ! -f crates/usgp-image/tests/dism_samples.rs ]; then
            echo "::error title=wim-samples verify NOT RUN::crates/usgp-image/tests/dism_samples.rs does not exist yet (plan WU-5). The samples were generated; the parser check did not run. This is not a PASS."
            exit 1
          fi
      - uses: ./.github/actions/fips-toolchain
      - name: Install Rust from rust-toolchain.toml
        run: rustup toolchain install && rustup show
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: wim-samples-${{ runner.os }}-go${{ env.EXPECT_GO }}-cmake${{ env.EXPECT_CMAKE }}-clang${{ env.EXPECT_CLANG }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Download the samples of this run (never from elsewhere; decision 0006)
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: wim-samples
          path: ${{ runner.temp }}/wim-samples
      - name: Check the sample checksums recorded on the Windows runner
        working-directory: ${{ runner.temp }}/wim-samples
        run: |
          set -euo pipefail
          test -s SHA256SUMS
          sha256sum --strict -c SHA256SUMS
      - name: Parser against the DISM samples (cargo test --features dism-samples)
        env:
          USGP_WIM_SAMPLES: ${{ runner.temp }}/wim-samples
        run: cargo test -p usgp-image --features dism-samples --test dism_samples --locked
