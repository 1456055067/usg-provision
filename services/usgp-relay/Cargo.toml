[package]
name = "usgp-relay"
description = "Per-segment boot and content cache service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "usgp-relay"
path = "src/main.rs"

[dependencies]
usgp-dhcp.workspace = true
usgp-tftp.workspace = true
usgp-httpboot.workspace = true
usgp-cache.workspace = true
usgp-proto.workspace = true
usgp-crypto.workspace = true
usgp-common.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net", "time", "sync", "macros", "signal"] }
socket2.workspace = true
libc.workspace = true
tracing.workspace = true
serde.workspace = true
thiserror.workspace = true
# M3 (plan WU-11, section 3.6): HTTP/1.1 client for the boot-policy pull
# over usgp-crypto's mTLS stream; key material in wiped buffers.
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
zeroize.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "io-util"] }
usgp-crypto = { workspace = true, features = ["test-pki"] }

[lints]
workspace = true
