[workspace]
resolver = "3"
members = ["crates/*", "services/*", "tools/*"]
exclude = ["fuzz", "testing"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
publish = false
# license: pending owner decision (ROADMAP D-10)

[workspace.dependencies]
# Internal crates
usgp-common = { path = "crates/usgp-common" }
usgp-crypto = { path = "crates/usgp-crypto" }
usgp-audit = { path = "crates/usgp-audit" }
usgp-db = { path = "crates/usgp-db" }
usgp-proto = { path = "crates/usgp-proto" }
usgp-dhcp = { path = "crates/usgp-dhcp" }
usgp-tftp = { path = "crates/usgp-tftp" }
usgp-httpboot = { path = "crates/usgp-httpboot" }
usgp-image = { path = "crates/usgp-image" }
usgp-disk = { path = "crates/usgp-disk" }
usgp-wincfg = { path = "crates/usgp-wincfg" }
usgp-deploy = { path = "crates/usgp-deploy" }
usgp-cache = { path = "crates/usgp-cache" }
usgp-api = { path = "crates/usgp-api" }
# External. Crypto crates are for usgp-crypto ONLY (decision 0001; deny.toml enforces).
# Exact pins (CM-3, release-notes REL-001): the FIPS module version is set by
# aws-lc-fips-sys (`links = "aws_lc_fips_0_14_3"`), and aws-lc-rs 1.18.2 only
# asks for `^0.14.2`, so both are pinned. Changing either is a reviewed
# manifest edit that must re-check the module's CMVP status (decision 0001).
aws-lc-rs = { version = "=1.18.2", default-features = false, features = ["fips"] }
aws-lc-fips-sys = { version = "=0.14.3" }
rustls = { version = "0.23.46", default-features = false, features = ["fips", "std"] }
thiserror = "2"
# M1 (plan WU-0, section 4). All pure Rust; licences MIT or MIT OR Apache-2.0.
# Features are chosen per member; defaults are kept off where they pull more
# than the member needs (CM-7).
tokio = { version = "1.54", default-features = false }
socket2 = { version = "0.6", features = ["all"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json", "std"] }
# M2 (plan WU-0, section 4). All pure Rust; licences MIT, Apache-2.0 OR MIT,
# or (whoami) Apache-2.0 OR BSL-1.0 OR MIT. Defaults off where they pull more
# than the members need (CM-7).
# PostgreSQL (decisions 0008, 0012): certificate-only login; the driver's
# password code (md-5/sha2/hmac) is present but unreachable; deny.toml confines it.
tokio-postgres = { version = "0.7.18", default-features = false, features = ["runtime", "with-uuid-1"] }
deadpool-postgres = { version = "0.14", default-features = false, features = ["rt_tokio_1"] }
# Ids are built from usgp-crypto DRBG bytes; no `v4`/getrandom feature.
uuid = { version = "1", default-features = false }
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
# usgp-crypto ONLY (decision 0001; deny.toml enforces). The rustls provider is
# passed explicitly (FIPS); the default aws_lc_rs/ring features stay off.
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12"] }
# usgp-crypto ONLY. The test PKI does not use x509-cert's `builder` feature.
x509-cert = { version = "0.2.5", default-features = false, features = ["std", "pem"] }
# 0.38 (plan section 4) has RUSTSEC-2026-0194/0195 (fixed in 0.41); 0.42 is current.
quick-xml = { version = "0.42", default-features = false }
zeroize = { version = "1.8", features = ["std"] }
serde_json = "1"
base64ct = { version = "1", features = ["alloc"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
mem_forget = "deny"
undocumented_unsafe_blocks = "deny"

[profile.release]
overflow-checks = true
