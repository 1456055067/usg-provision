# CI gates (see .claude/skills/provision-workflow/references/quality-gates.md).
# Third-party actions are pinned by full commit SHA (supply chain, SR-4).
#
# Result rule (all jobs): a gate that did not run is never reported as PASS.
# The boot smoke harness exits 77 for NOT RUN; the boot-smoke job turns that
# into a failed job with a "NOT RUN" annotation, because GitHub Actions has no
# neutral job state and a green job reads as PASS.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly re-run so new RustSec advisories surface without a code change.
    # Also the trigger for the fuzz-smoke and large-upload jobs.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Decision 0001: always build the FIPS module from the crate's bundled
  # source. Disable auto-detection of a system AWS-LC/OpenSSL install
  # (OPENSSL_DIR, pkg-config), which the -sys build scripts otherwise probe
  # and may load and execute. Linux FIPS builds are static; pin that.
  AWS_LC_FIPS_SYS_USE_SYSTEM: "0"
  AWS_LC_SYS_USE_SYSTEM: "0"
  AWS_LC_FIPS_SYS_STATIC: "1"
  # Smaller dev/test builds (CI run 40815815025 ran out of disk): no
  # incremental state, and line tables only (backtraces keep file:line).
  # The release profile is not changed, so shipped artifacts and their
  # reproducibility are unaffected. When these change, bump the "v2" in the
  # cache keys of every job that builds the dev profile, or a restored cache
  # holds stale artifacts that are never replaced.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  gates:
    runs-on: ubuntu-24.04
    # A warm run takes about 8 min. 60 leaves room for a cold cache; the
    # test steps carry their own bounds, so a hung test fails in minutes
    # with its step named instead of using up the job (run 40910029759).
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free runner disk (unused preinstalled toolchains; df -h before and after)
        run: scripts/ci-free-disk.sh
      - uses: ./.github/actions/fips-toolchain
        with:
          extra-packages: ripgrep
      - name: Install Rust from rust-toolchain.toml
        run: rustup toolchain install && rustup show
      # Restore and save are split so the save holds dependency artifacts
      # only (scripts/ci-prune-target.sh, last steps). A warm target cuts
      # this job from about 17 to 3 minutes (runs 40776984780, 40776468136).
      - name: Restore the cargo cache (registry, git, dependency artifacts)
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: gates-v2-${{ runner.os }}-go${{ env.EXPECT_GO }}-cmake${{ env.EXPECT_CMAKE }}-clang${{ env.EXPECT_CLANG }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy with the test-only features (lint only, never run here)
        # Lints the code behind test-pki, testkit, dism-samples,
        # pg-integration and large-tests. The dism-samples and pg tests fail
        # by design without their data, so this job never runs them.
        run: >-
          cargo clippy --workspace --all-targets --locked
          --features test-pki,testkit,dism-samples,pg-integration,large-tests
          -- -D warnings
      - name: cargo test --workspace --locked
        # About 3 min warm. A test that never ends (run 40910029759: four
        # qa_m3 agent tests) fails here, named, instead of cancelling the
        # job.
        timeout-minutes: 25
        run: cargo test --workspace --locked
      - name: cargo test --workspace --doc --locked
        timeout-minutes: 15
        run: cargo test --workspace --doc --locked
      - name: Feature-gated test evidence (usgp-crypto test-pki, usgp-image testkit)
        # Per package, so the mTLS (REQ-RBAC-005, REQ-IMG-053) and WIM
        # negative/XPRESS (REQ-IMG-037/038) tests do not depend on another
        # crate's dev-dependency features. Each named test binary must run
        # at least one test with none ignored. Never --all-features for
        # usgp-image here: dism-samples fails without USGP_WIM_SAMPLES.
        run: |
          set -uo pipefail
          bad=0
          # require <log> <test file stem>...
          require() {
            local log=$1 t line passed ignored
            shift
            for t in "$@"; do
              # awk reads the log itself and strips the colour codes: no
              # pipe, so its early exit cannot SIGPIPE a writer (run
              # 40815815025). \033 in a regex is POSIX and mawk-supported.
              line="$(awk -v t="tests/$t.rs" '{ gsub(/\033\[[0-9;]*m/, "") } $1 == "Running" && $2 == t { f = 1; next } f && /^test result:/ { print; exit }' "$log")"
              passed="$(echo "$line" | sed -n 's/.* \([0-9][0-9]*\) passed;.*/\1/p')"
              ignored="$(echo "$line" | sed -n 's/.*; \([0-9][0-9]*\) ignored;.*/\1/p')"
              if [ -z "$line" ] || [ "${passed:-0}" -eq 0 ] || [ "${ignored:-1}" -ne 0 ]; then
                echo "::error::tests/$t.rs did not run as required (result: '${line:-none}')"
                bad=1
              else
                echo "ok: $t: $line"
              fi
            done
          }
          # run_feature <log name> <cargo test args...>
          run_feature() {
            local log="$RUNNER_TEMP/$1.log" status=0
            shift
            cargo test --locked "$@" 2>&1 | tee "$log" || status=$?
            if [ "$status" -ne 0 ]; then
              echo "::error::cargo test $* exited $status"
              bad=1
            fi
          }
          run_feature crypto-test-pki -p usgp-crypto --features test-pki
          require "$RUNNER_TEMP/crypto-test-pki.log" tls_mtls envelope sign
          run_feature image-testkit -p usgp-image --features testkit
          require "$RUNNER_TEMP/image-testkit.log" check negative xpress_vectors
          exit "$bad"
      - name: Shipped builds enable no test-only feature (SI-7, CM-7)
        # The graph `cargo build --workspace --bins --release` resolves
        # (normal and build edges, no dev) must not turn on test-pki (and
        # its x509-cert builder), testkit, dism-samples, pg-integration or
        # large-tests.
        run: |
          set -euo pipefail
          hits="$(cargo tree --locked --workspace -e features,normal,build --target all --prefix none \
            | grep -E '(feature "(test-pki|testkit|dism-samples|pg-integration|large-tests|parse-testkit|sink-testkit)"|^x509-cert feature "builder")' \
            | sort -u)" || true
          if [ -n "$hits" ]; then
            echo "::error::test-only features reach the shipped build graph:"
            echo "$hits"
            exit 1
          fi
          echo "test-only features: none in the shipped build graph"
      - name: No sim feature in the Windows agent build graph (NIST-010, CM-7)
        # The simulated platform must never reach the shipped Windows agent.
        # Inverted on usgp-deploy: a root command-line feature shows only
        # in the inverted tree. The query must first detect --features sim,
        # so a broken query fails. Off Windows the agent is sim-only by
        # design and is never shipped (fips-linkage only scans it; the only
        # agent artifact is the Windows pair from windows-agent).
        run: |
          set -euo pipefail
          q=(cargo tree --locked -e "features,normal,build" --target x86_64-pc-windows-msvc
            -i usgp-deploy --prefix none)
          self="$("${q[@]}" -p usgp-preboot-agent --features sim | grep -F 'feature "sim"' || true)"
          if [ -z "$self" ]; then
            echo "::error::sim gate self-check: --features sim was not detected; the query is broken"
            exit 1
          fi
          hits="$({ "${q[@]}" -p usgp-preboot-agent; "${q[@]}" --workspace; } | grep -F 'feature "sim"' | sort -u || true)"
          if [ -n "$hits" ]; then
            echo "::error::sim reaches the Windows agent build graph:"
            echo "$hits"
            exit 1
          fi
          echo "sim: not in the Windows agent build graph"
      - run: scripts/check-pure-rust.sh
      - run: scripts/check-names.sh
      - run: NAMES_FORCE_GREP=1 scripts/check-names.sh
      - run: scripts/test-check-names.sh
      # REQ-PE-001 (finding QA-001): no Windows PE / ADK file or WIM image in
      # the repository, and the gate's own 43 positive/negative cases. The
      # shipped-artifact half runs in fips-linkage and boot-smoke.
      - run: scripts/check-pe-files.sh repo
      - run: scripts/test-check-pe-files.sh
      - name: Binaries start in FIPS mode (fail closed, SC-13; start-up contract, plan section 3.6)
        run: |
          set -euo pipefail
          cargo build --workspace --bins --locked
          # Run the artifacts directly (not via cargo run) so a missing
          # runtime library fails here.
          # The agent needs a configuration to run; --self-test is its
          # FIPS-check-only mode (exit 0 only with FIPS active).
          target/debug/usgp-preboot-agent --self-test
          target/debug/usgp-cli
          # The relay's and the server's FIPS-check-only mode; with no
          # arguments each prints usage and exits 2, which must not be
          # mistaken for a pass.
          for b in usgp-relay usgp-server; do
            "target/debug/$b" --self-check
            status=0
            "target/debug/$b" 2> /dev/null || status=$?
            if [ "$status" -ne 2 ]; then
              echo "::error::$b with no arguments exited $status, expected 2 (usage)"
              exit 1
            fi
          done
      - name: Keep only dependency artifacts for the cache
        if: ${{ steps.cargo-cache.outputs.cache-hit != 'true' }}
        run: scripts/ci-prune-target.sh debug
      - name: Save the cargo cache
        if: ${{ steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  fips-linkage:
    # Decision 0001 Amendment 1: shipped binaries link the FIPS module, do not
    # link the non-FIPS AWS-LC library, and report FIPS mode active.
    # Also the release-artifact name scan (CR-303, decision 0005).
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free runner disk (unused preinstalled toolchains; df -h before and after)
        run: scripts/ci-free-disk.sh
      - uses: ./.github/actions/fips-toolchain
      - name: Install Rust (product and testing toolchain files)
        run: |
          set -euo pipefail
          rustup toolchain install && rustup show
          (cd testing/uefi-payload && rustup toolchain install)
          (cd testing/netlab && rustup toolchain install)
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-${{ runner.os }}-go${{ env.EXPECT_GO }}-cmake${{ env.EXPECT_CMAKE }}-clang${{ env.EXPECT_CLANG }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'testing/*/Cargo.lock', 'testing/*/rust-toolchain.toml') }}
      - name: Stage the UEFI payloads (as the runner user)
        # Stages the two .efi files the artifact scan requires. It also
        # builds the relay and cli with -p; the workspace build below runs
        # after it, so the linkage check and the name scan both see the
        # workspace release binaries.
        run: scripts/boot-smoke.sh build
      - run: cargo build --workspace --bins --release --locked
      # Runs usgp-relay with --self-check (bin_args in the script).
      - run: scripts/check-fips-linkage.sh release
      - name: Name scan of the release binaries and staged payloads (CR-303)
        # No exclusions; exit 1 on a hit, exit 2 if an artifact is missing.
        # Also runs check-pe-files.sh (REQ-PE-001) on the relay, the cli and
        # the payloads.
        run: scripts/check-artifact-names.sh
      - name: Every shipped binary, name scan and REQ-PE-001 (CR-303, QA-001)
        # check-artifact-names.sh lists only the relay and the cli
        # (REL-M2-P6-001); this covers all four release binaries. Fails
        # closed: a missing binary is exit 2 from check-pe-files.sh.
        run: |
          set -euo pipefail
          bins=(target/release/usgp-server target/release/usgp-relay
            target/release/usgp-preboot-agent target/release/usgp-cli)
          scripts/check-pe-files.sh files "${bins[@]}"
          hits="$(LC_ALL=C grep -a -i -l -E -e 'tan[i]um' -- "${bins[@]}" || true)"
          if [ -n "$hits" ]; then
            echo "::error::clean-room name in: $hits"
            exit 1
          fi
          echo "shipped binaries: name scan and REQ-PE-001 OK (${#bins[@]} files)"

  windows-agent:
    # M3 WU-0 skeleton (plan sections 1.2(d) and 10.2; decision 0019); WU-15
    # pins the FIPS toolchain (REL-M3-W0-001), runs the VHD tests with a
    # sentinel disk (QA-001) and builds the agent pair artifact
    # (REL-M3-W0-002). Still open: the linker-map check and the DISM apply
    # oracle (impl-notes-wu15).
    # Native x86_64-pc-windows-msvc build with the static CRT
    # (.cargo/config.toml). Records the WU-0 probes in the job summary:
    #   1. aws-lc-fips-sys builds and passes its power-on self-test with a
    #      static CRT (if not: stop and report, risk R-1);
    #   2. the agent's cargo tree on the Windows target;
    #   3. whether tokio, as usgp-crypto uses it, pulls in windows-sys.
    # Then lints, builds and tests the crates that compile on Windows. Only
    # this job compiles the cfg(windows) code (usgp-winapi's ffi.rs).
    runs-on: windows-2025
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    env:
      TARGET: x86_64-pc-windows-msvc
      # The FIPS module is a DLL on Windows: AWS-LC builds a static FIPS
      # module only on Linux. .cargo/config.toml pins this per target too.
      AWS_LC_FIPS_SYS_STATIC: "0"
      GOTOOLCHAIN: local
      GOPROXY: "off"
      WIN_CRATES: >-
        usgp-common usgp-proto usgp-crypto usgp-image usgp-disk usgp-wincfg
        usgp-deploy usgp-winapi usgp-preboot-agent
    steps:
      - name: Check out without CRLF conversion (fixtures and hashes as on Linux)
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust from rust-toolchain.toml
        run: |
          rustup toolchain install
          if ($LASTEXITCODE -ne 0) { exit 1 }
          rustup show
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-agent-v2-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml') }}
      - name: FIPS module build toolchain (Windows; pinned, REL-M3-W0-001)
        # AWS-LC FIPS on Windows needs Go, Perl, CMake, Ninja, NASM, MSVC and
        # libclang (bindgen; no pre-generated Windows bindings ship).
        # Strawberry Perl, never Git's MSYS perl.
        #
        # Pins (CM-2, SR-4; change deliberately, CM-3, and record the change
        # in CHANGELOG.md):
        # - NASM is not in the runner image: installed from Chocolatey at an
        #   exact version, and the installed package file must have the
        #   SHA-512 the Chocolatey feed published for that version.
        # - Ninja is the runner image's: exact version asserted.
        # - Go, CMake, Perl, LLVM (libclang) and Visual Studio come from the
        #   runner image (windows-2025, image 20261021.278 when pinned):
        #   version series asserted, as the Linux fips-toolchain action does;
        #   exact versions and SHA-256 of each tool are recorded.
        # A drift fails the job; it is never silently accepted.
        env:
          PIN_NASM_CHOCO: "3.2.0"
          PIN_NASM_NUPKG_SHA512: "78A722FAC25A736929A1171BF6BB9A54FA3E373532B114AB364F7479E15663B50749A89D1C0B54367125EB2D73F7C616487A5745FAE5EA06D41480EC8F95CA88"
          PIN_NINJA: "1.13.2"
          SERIES_GO: "1.24"
          SERIES_CMAKE: "4.4"
          SERIES_PERL: "5.42"
          SERIES_LLVM: "20.1"
          SERIES_VS: "18"
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          function Fail([string]$s) { Write-Output "::error::$s (pinned toolchain, REL-M3-W0-001)"; exit 1 }
          function Series([string]$name, [string]$want, [string]$got) {
            if ($got -ne $want -and -not $got.StartsWith("$want.")) { Fail "$name is $got, expected $want.x" }
          }
          choco install nasm --version="$env:PIN_NASM_CHOCO" -y --no-progress --allow-downgrade
          $choco = if ($env:ChocolateyInstall) { $env:ChocolateyInstall } else { 'C:\ProgramData\chocolatey' }
          $nupkg = Join-Path $choco 'lib\nasm\nasm.nupkg'
          if (-not (Test-Path -LiteralPath $nupkg)) { Fail "no $nupkg after choco install" }
          $h = (Get-FileHash -LiteralPath $nupkg -Algorithm SHA512).Hash
          if ($h -ne $env:PIN_NASM_NUPKG_SHA512) { Fail "nasm.nupkg SHA-512 is $h, expected $env:PIN_NASM_NUPKG_SHA512" }
          $nasmDir = 'C:\Program Files\NASM'
          if (-not (Test-Path -LiteralPath (Join-Path $nasmDir 'nasm.exe'))) { Fail "nasm.exe not in $nasmDir" }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $nasmDir -Encoding utf8
          $env:PATH = "$nasmDir;$env:PATH"
          $llvm = 'C:\Program Files\LLVM\bin'
          if (-not (Test-Path -LiteralPath (Join-Path $llvm 'libclang.dll'))) { Fail "libclang.dll not found in $llvm (bindgen needs it)" }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "LIBCLANG_PATH=$llvm" -Encoding utf8
          foreach ($t in 'go', 'cmake', 'ninja', 'nasm', 'perl') {
            if (-not (Get-Command $t -ErrorAction SilentlyContinue)) { Fail "$t not found" }
          }
          $nasm = (Get-Command nasm).Source
          if ($nasm -ne (Join-Path $nasmDir 'nasm.exe')) { Fail "nasm resolves to $nasm, not the pinned $nasmDir\nasm.exe" }
          $perl = (Get-Command perl).Source
          if ($perl -match '\\Git\\') { Fail "perl resolves to Git's MSYS perl ($perl); Strawberry Perl is required" }
          $ninjaV = (ninja --version).Trim()
          if ($ninjaV -ne $env:PIN_NINJA) { Fail "ninja is $ninjaV, expected exactly $env:PIN_NINJA" }
          $nasmV = (nasm -v) -join ' '
          if ($nasmV -notmatch '^NASM version 3\.') { Fail "nasm reports '$nasmV', expected NASM 3.x from choco $env:PIN_NASM_CHOCO" }
          $goV = (go env GOVERSION).Trim() -replace '^go', ''
          Series go $env:SERIES_GO $goV
          $cmakeV = ((cmake --version)[0] -split ' ')[2]
          Series cmake $env:SERIES_CMAKE $cmakeV
          $perlV = (perl -e 'print $^V') -replace '^v', ''
          Series perl $env:SERIES_PERL $perlV
          $clangLine = (& (Join-Path $llvm 'clang.exe') --version)[0]
          $clangV = if ($clangLine -match 'clang version ([0-9.]+)') { $Matches[1] } else { '' }
          Series 'llvm (libclang)' $env:SERIES_LLVM $clangV
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vsV = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationVersion
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Series 'visual studio' $env:SERIES_VS $vsV
          $vcTools = Get-Content -LiteralPath (Join-Path $vsPath 'VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt') -TotalCount 1
          function Sha([string]$f) { "$((Get-FileHash -LiteralPath $f -Algorithm SHA256).Hash.ToLowerInvariant())  $f" }
          $lines = @('### windows-agent: FIPS module build toolchain (pinned, REL-M3-W0-001)', '```text')
          $lines += "nasm:   $nasmV (choco nasm $env:PIN_NASM_CHOCO, nupkg SHA-512 pinned)"
          $lines += "ninja:  $ninjaV (pinned exactly)"
          $lines += "go:     $goV (series $env:SERIES_GO)"
          $lines += "cmake:  $cmakeV (series $env:SERIES_CMAKE)"
          $lines += "perl:   $perlV $perl (series $env:SERIES_PERL)"
          $lines += "clang:  $clangV (series $env:SERIES_LLVM)"
          $lines += "msvc:   Visual Studio $vsV, VC tools $vcTools (series $env:SERIES_VS)"
          $lines += "rustc:  $(rustc -V)"
          $lines += "runner: $env:ImageOS $env:ImageVersion"
          $lines += 'sha256:'
          foreach ($t in 'nasm', 'ninja', 'go', 'cmake', 'perl') { $lines += Sha (Get-Command $t).Source }
          $lines += Sha (Join-Path $llvm 'libclang.dll')
          $lines += '```'
          $lines | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
      - name: "Probe 1: FIPS module build, static CRT and self-test (release agent)"
        # Records the answer either way; fails the job if any part fails.
        # The agent stub's main is the FIPS start-up check (exit 0 only in
        # FIPS mode); WU-12 adds --self-test with the module version.
        run: |
          $ErrorActionPreference = 'Stop'
          function Note([string]$s) { Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value $s -Encoding utf8 }
          function Fail([string]$s) {
            Note "RESULT: FAIL - $s"
            Note '```'
            Write-Output "::error::probe 1 failed: $s"
            exit 1
          }
          Note '### Probe 1: aws-lc-fips-sys on x86_64-pc-windows-msvc with +crt-static'
          Note '```text'
          cargo build --locked --release --target $env:TARGET -p usgp-preboot-agent
          if ($LASTEXITCODE -ne 0) { Fail "cargo build exited $LASTEXITCODE (FIPS module or agent did not build)" }
          Note 'build: OK'
          $out = "target\$env:TARGET\release"
          # The CRT model the module was configured with.
          $caches = @(Get-ChildItem -Path "$out\build" -Filter CMakeCache.txt -Recurse |
            Where-Object { $_.FullName -match '\\aws-lc-fips-sys-' })
          if ($caches.Count -eq 0) { Fail 'no CMakeCache.txt for aws-lc-fips-sys' }
          foreach ($c in $caches) {
            $rt = @(Select-String -LiteralPath $c.FullName -Pattern '^CMAKE_MSVC_RUNTIME_LIBRARY:[A-Z]*=(.*)$')
            $shared = @(Select-String -LiteralPath $c.FullName -Pattern '^BUILD_SHARED_LIBS:[A-Z]*=(.*)$')
            $rtv = if ($rt.Count) { $rt[0].Matches[0].Groups[1].Value } else { '(unset)' }
            $shv = if ($shared.Count) { $shared[0].Matches[0].Groups[1].Value } else { '(unset)' }
            Note "module CMake: CMAKE_MSVC_RUNTIME_LIBRARY=$rtv BUILD_SHARED_LIBS=$shv"
            if ($rtv -ne 'MultiThreaded') { Fail "FIPS module CRT is '$rtv', expected MultiThreaded (/MT)" }
          }
          # Imported DLLs of the agent and the module: no VC runtime or UCRT.
          $readobj = 'C:\Program Files\LLVM\bin\llvm-readobj.exe'
          function Imports([string]$f) {
            & $readobj --coff-imports $f | Select-String -Pattern '^\s*Name:\s*(\S+\.dll)\s*$' |
              ForEach-Object { $_.Matches[0].Groups[1].Value.ToLowerInvariant() } | Sort-Object -Unique
          }
          $crt = '^(vcruntime|msvcp|msvcr|ucrtbase|concrt|vccorlib|api-ms-win-crt-)'
          $exe = Join-Path $out 'usgp-preboot-agent.exe'
          $dlls = @(Get-ChildItem -Path "$out\build" -Filter '*.dll' -Recurse |
            Where-Object { $_.FullName -match '\\aws-lc-fips-sys-' -and $_.Name -match '^aws_lc_fips_.*\.dll$' })
          Note "module DLLs: $(if ($dlls.Count) { ($dlls | ForEach-Object Name) -join ', ' } else { 'none (static module)' })"
          foreach ($f in @($exe) + @($dlls | ForEach-Object FullName)) {
            $imp = @(Imports $f)
            Note "imports of $(Split-Path -Leaf $f): $($imp -join ' ')"
            $bad = @($imp | Where-Object { $_ -match $crt })
            if ($bad.Count) { Fail "$(Split-Path -Leaf $f) imports a dynamic C runtime: $($bad -join ' ')" }
          }
          # Run from a staging directory holding only the agent and the
          # module DLL, as it would sit in Windows PE.
          $stage = Join-Path $env:RUNNER_TEMP 'agent-stage'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -LiteralPath $exe -Destination $stage
          foreach ($d in $dlls) { Copy-Item -LiteralPath $d.FullName -Destination $stage }
          $msg = & (Join-Path $stage 'usgp-preboot-agent.exe') --self-test 2>&1
          $code = $LASTEXITCODE
          Note "agent FIPS start-up check: exit $code $msg"
          if ($code -ne 0) { Fail "agent FIPS start-up check exited $code" }
          Note 'RESULT: PASS - module builds with /MT, no dynamic CRT import, FIPS mode active'
          Note '```'
      - name: "Probes 2 and 3: the agent's tree on Windows; tokio and windows-sys in usgp-crypto"
        run: |
          $ErrorActionPreference = 'Stop'
          $agent = cargo tree --locked -p usgp-preboot-agent -e normal,build --target $env:TARGET
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $crypto = cargo tree --locked -p usgp-crypto -e normal,build --target $env:TARGET --prefix none
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $ws = @($crypto | Where-Object { $_ -match '^windows-sys v' })
          $lines = @('### Probe 2: cargo tree -p usgp-preboot-agent -e normal,build (x86_64-pc-windows-msvc)', '```text')
          $lines += $agent
          $lines += '```'
          $lines += '### Probe 3: windows-sys in the usgp-crypto tree (tokio as usgp-crypto uses it)'
          $lines += '```text'
          $lines += $(if ($ws.Count) { "yes: $($ws -join ', ')" } else { 'no' })
          $lines += '```'
          $lines | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
      - name: Clippy for the Windows target (the only lint of cfg(windows) code)
        run: |
          $pkgs = $env:WIN_CRATES -split ' ' | ForEach-Object { '-p', $_ }
          cargo clippy --locked --target $env:TARGET --all-targets @pkgs -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Build and test the Windows crates (static CRT)
        # Must include usgp-winapi's raw-dylib link probe (ffi.rs).
        run: |
          $pkgs = $env:WIN_CRATES -split ' ' | ForEach-Object { '-p', $_ }
          cargo build --locked --target $env:TARGET @pkgs
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $log = Join-Path $env:RUNNER_TEMP 'windows-tests.log'
          cargo test --locked --target $env:TARGET @pkgs 2>&1 | Tee-Object -FilePath $log
          $status = $LASTEXITCODE
          if ($status -ne 0) {
            Write-Output "::error::cargo test exited $status"
            exit 1
          }
          $plain = (Get-Content -LiteralPath $log) -replace '\x1b\[[0-9;]*m', ''
          if (-not ($plain -match '^test ffi::tests::windows_sys_links_and_agrees_with_std \.\.\. ok$')) {
            Write-Output '::error::usgp-winapi link probe did not run and pass'
            exit 1
          }
          Write-Output 'usgp-winapi link probe: ok'
      - name: VHD tests as administrator (QA-001; plan section 10.2), sentinel disk untouched
        # The only tests that write a real disk: usgp-winapi's vhd_disk (raw
        # I/O, property update, volume resolution by extents, letters) and
        # winsink (WinSink apply on an NTFS VHD volume, links, short names,
        # descriptor control bits). One thread: the tests drive DiskPart and
        # pick free drive letters.
        #
        # "Other disks untouched" (REQ-DISK-015): a 64 MiB fixed VHD (raw
        # sectors followed by a 512-byte footer) filled with a pattern is
        # attached read-write for the whole run; the SHA-256 of its sectors
        # must be the same after detaching. It proves no test wrote to a disk
        # it did not create; it cannot prove that for the runner's own disk.
        #
        # Also writes the OPEN-WAPI-7 lines (DACL control bits, WU-5) and the
        # GPT-OBS-001 line (vhd_disk reads DiskPart's GPT back with
        # usgp_disk::parse_gpt, REL-M3-WU15-001) to the job summary. A
        # missing or refused GPT-OBS-001 fails the step.
        env:
          USGP_WIN_VHD: "1"
          VHD_TESTS: >-
            vhd_raw_io_update_and_volume_letters synthetic_wim_applies_to_a_vhd_volume
            links_and_junctions_are_applied_byte_for_byte short_names_set_with_8dot3_generation_disabled
            probe_normal_on_directory_with_named_stream
        run: |
          $ErrorActionPreference = 'Stop'
          function Note([string]$s) { Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value $s -Encoding utf8 }
          $me = [Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()
          if (-not $me.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
            Write-Output '::error::the VHD tests need administrator rights; the step is not elevated (NOT RUN is never PASS)'
            exit 1
          }
          function Invoke-DiskPartScript([string[]]$lines) {
            $f = Join-Path $env:RUNNER_TEMP "diskpart-$([guid]::NewGuid()).txt"
            Set-Content -LiteralPath $f -Value $lines -Encoding ascii
            $out = diskpart.exe /s $f 2>&1
            $code = $LASTEXITCODE
            Remove-Item -LiteralPath $f
            if ($code -ne 0) { Write-Output $out; throw "diskpart exited $code" }
          }
          function SectorHash([string]$f, [long]$n) {
            $fs = [IO.File]::Open($f, 'Open', 'Read', 'ReadWrite')
            try {
              $sha = [Security.Cryptography.SHA256]::Create()
              $buf = [byte[]]::new(1048576)
              $left = $n
              while ($left -gt 0) {
                $got = $fs.Read($buf, 0, [int][Math]::Min([long]$buf.Length, $left))
                if ($got -le 0) { throw "short read of $f" }
                [void]$sha.TransformBlock($buf, 0, $got, $null, 0)
                $left -= $got
              }
              [void]$sha.TransformFinalBlock($buf, 0, 0)
              ($sha.Hash | ForEach-Object { $_.ToString('x2') }) -join ''
            } finally { $fs.Dispose() }
          }
          $sent = Join-Path $env:RUNNER_TEMP 'usgp-sentinel.vhd'
          if (Test-Path -LiteralPath $sent) { Remove-Item -LiteralPath $sent }
          Invoke-DiskPartScript @("create vdisk file=`"$sent`" maximum=64 type=fixed")
          $n = (Get-Item -LiteralPath $sent).Length - 512
          if ($n -ne 64MB) { Write-Output "::error::sentinel VHD has $n data bytes, expected $(64MB)"; exit 1 }
          # A pattern, so any write shows (zeros could hide a zero write); no
          # partition table, so Windows leaves the disk RAW.
          $pat = [byte[]]::new(1048576)
          $rng = [Security.Cryptography.RandomNumberGenerator]::Create()
          $rng.GetBytes($pat)
          $pat[510] = 0; $pat[511] = 0
          $fs = [IO.File]::Open($sent, 'Open', 'ReadWrite')
          try { for ($i = 0; $i -lt 64; $i++) { $fs.Write($pat, 0, $pat.Length) } } finally { $fs.Dispose() }
          $before = SectorHash $sent $n
          Invoke-DiskPartScript @("select vdisk file=`"$sent`"", 'attach vdisk')
          $img = Get-DiskImage -ImagePath $sent
          if (-not $img.Attached) { Write-Output '::error::sentinel VHD did not attach'; exit 1 }
          $sentDisk = ($img | Get-Disk).Number
          $log = Join-Path $env:RUNNER_TEMP 'vhd-tests.log'
          $status = 0
          try {
            # Test output on stderr must not stop the step; the exit status
            # and the per-test lines decide. --show-output (not --nocapture)
            # keeps each "test NAME ... ok" line whole and still prints what
            # the tests print (the OPEN-WAPI-7 lines).
            $ErrorActionPreference = 'Continue'
            cargo test --locked --target $env:TARGET -p usgp-winapi --features sink-testkit `
              --test vhd_disk --test winsink -- --ignored --show-output --test-threads=1 2>&1 |
              Tee-Object -FilePath $log
            $status = $LASTEXITCODE
          } finally {
            $ErrorActionPreference = 'Stop'
            $still = (Get-DiskImage -ImagePath $sent).Attached
            Invoke-DiskPartScript @("select vdisk file=`"$sent`"", 'detach vdisk')
          }
          $after = SectorHash $sent $n
          $plain = @((Get-Content -LiteralPath $log) -replace '\x1b\[[0-9;]*m', '')
          $bad = @()
          foreach ($t in ($env:VHD_TESTS -split '\s+' | Where-Object { $_ })) {
            if (-not ($plain -match "^test $t \.\.\. ok$")) { $bad += $t }
          }
          $wapi = @($plain | Where-Object { $_ -match '^OPEN-WAPI-7 ' })
          $obs = @($plain | Where-Object { $_ -match 'GPT-OBS-001' })
          Note '### VHD tests (QA-001): vhd_disk and winsink with --ignored, USGP_WIN_VHD=1'
          Note '```text'
          Note "cargo test exit: $status"
          foreach ($l in @($plain | Where-Object { $_ -match '^test .* \.\.\. ' -or $_ -match '^test result:' })) { Note $l }
          Note "sentinel disk $sentDisk ($sent): attached for the whole run: $still"
          Note "sentinel sectors sha256 before: $before"
          Note "sentinel sectors sha256 after:  $after"
          Note '```'
          Note '### OPEN-WAPI-7: DACL protected and auto-inherited control bits (stored vs applied)'
          Note '```text'
          if ($wapi.Count) { foreach ($l in $wapi) { Note $l } } else { Note '(no OPEN-WAPI-7 line printed)' }
          Note '```'
          Note '### GPT-OBS-001: our read-back of a GPT that DiskPart wrote'
          Note '```text'
          if ($obs.Count) { foreach ($l in $obs) { Note $l } } else { Note 'NOT RUN: vhd_disk printed no GPT-OBS-001 line' }
          Note '```'
          if (-not @($obs | Where-Object { $_ -match 'GPT-OBS-001 accepted' }).Count) {
            Write-Output '::error title=GPT-OBS-001::no "GPT-OBS-001 accepted" line from vhd_disk (NOT RUN or refused is never PASS)'
            exit 1
          }
          if ($status -ne 0) { Write-Output "::error::VHD tests: cargo test exited $status"; exit 1 }
          if ($bad.Count) { Write-Output "::error::VHD tests did not run and pass: $($bad -join ', ') (NOT RUN is never PASS)"; exit 1 }
          if (-not $wapi.Count) { Write-Output '::error::winsink printed no OPEN-WAPI-7 line'; exit 1 }
          if (-not $still) { Write-Output '::error::the sentinel VHD was detached during the run; the untouched check is void'; exit 1 }
          if ($before -ne $after) { Write-Output "::error::the sentinel disk changed during the VHD tests (REQ-DISK-015): $before -> $after"; exit 1 }
          Write-Output 'VHD tests: 4 passed; sentinel disk unchanged'
      - name: Release agent artifact, exe and FIPS DLL as a hashed pair (REL-M3-W0-002)
        # The agent ships as two files that must stay together: the .exe and
        # the AWS-LC FIPS module DLL it imports at load time. Built alone
        # with -p (REL-M3-W0-004: no feature unification with the workspace).
        # Checks: exactly one module DLL, named for the aws-lc-fips-sys
        # version in Cargo.lock; the exe imports it and no other AWS-LC DLL;
        # neither imports a dynamic C runtime; the staged pair passes
        # --self-test (FIPS mode) from a directory holding only the pair; no
        # clean-room name in either (CR-303). SHA256SUMS lists both files;
        # PAIR.sha256 is the SHA-256 of SHA256SUMS, so one digest names the
        # pair. Not signed (REL-M3-WU15-002); not a release, a CI artifact.
        id: agent-artifact
        run: |
          $ErrorActionPreference = 'Stop'
          function Fail([string]$s) { Write-Output "::error::agent artifact: $s"; exit 1 }
          # NIST-010: the shipped pair is never built with the simulation.
          $sim = cargo tree --locked -p usgp-preboot-agent -e features,normal,build --target $env:TARGET -i usgp-deploy --prefix none |
            Select-String -SimpleMatch 'feature "sim"'
          if ($LASTEXITCODE -ne 0) { Fail "cargo tree exited $LASTEXITCODE" }
          if ($sim) { Fail "the agent's Windows build graph enables sim: $($sim -join '; ')" }
          cargo build --locked --release --target $env:TARGET -p usgp-preboot-agent
          if ($LASTEXITCODE -ne 0) { Fail "cargo build exited $LASTEXITCODE" }
          $out = "target\$env:TARGET\release"
          $exe = Join-Path $out 'usgp-preboot-agent.exe'
          $lock = Get-Content -LiteralPath Cargo.lock -Raw
          if ($lock -notmatch '(?m)^name = "aws-lc-fips-sys"\r?\nversion = "([0-9]+)\.([0-9]+)\.([0-9]+)"') { Fail 'aws-lc-fips-sys not in Cargo.lock' }
          $dllName = "aws_lc_fips_$($Matches[1])_$($Matches[2])_$($Matches[3])_crypto.dll"
          $dlls = @(Get-ChildItem -Path "$out\build" -Filter '*.dll' -Recurse |
            Where-Object { $_.FullName -match '\\aws-lc-fips-sys-' -and $_.Name -match '^aws_lc_fips_.*\.dll$' })
          $names = @($dlls | ForEach-Object Name | Sort-Object -Unique)
          if ($names.Count -ne 1 -or $names[0] -ne $dllName) { Fail "module DLLs found: $($names -join ', '); expected exactly $dllName" }
          $hashes = @($dlls | ForEach-Object { (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash } | Sort-Object -Unique)
          if ($hashes.Count -ne 1) { Fail "$dllName exists in $($dlls.Count) build directories with different content" }
          $dll = $dlls[0].FullName
          $readobj = 'C:\Program Files\LLVM\bin\llvm-readobj.exe'
          function Imports([string]$f) {
            & $readobj --coff-imports $f | Select-String -Pattern '^\s*Name:\s*(\S+\.dll)\s*$' |
              ForEach-Object { $_.Matches[0].Groups[1].Value.ToLowerInvariant() } | Sort-Object -Unique
          }
          $ei = @(Imports $exe)
          $di = @(Imports $dll)
          if ($ei -notcontains $dllName.ToLowerInvariant()) { Fail "the exe does not import $dllName (imports: $($ei -join ' '))" }
          $otherLc = @($ei | Where-Object { $_ -match '^aws_lc' -and $_ -ne $dllName.ToLowerInvariant() })
          if ($otherLc.Count) { Fail "the exe imports another AWS-LC DLL: $($otherLc -join ' ')" }
          $crt = '^(vcruntime|msvcp|msvcr|ucrtbase|concrt|vccorlib|api-ms-win-crt-)'
          $b = @($ei | Where-Object { $_ -match $crt })
          if ($b.Count) { Fail "the exe imports a dynamic C runtime: $($b -join ' ')" }
          $b = @($di | Where-Object { $_ -match $crt })
          if ($b.Count) { Fail "$dllName imports a dynamic C runtime: $($b -join ' ')" }
          $sha = $env:GITHUB_SHA.Substring(0, 12)
          $name = "usgp-preboot-agent-$sha-x86_64-pc-windows-msvc"
          $dist = Join-Path 'target\agent-dist' $name
          if (Test-Path -LiteralPath $dist) { Remove-Item -LiteralPath $dist -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item -LiteralPath $exe -Destination $dist
          Copy-Item -LiteralPath $dll -Destination $dist
          foreach ($f in @(Get-ChildItem -LiteralPath $dist -File)) {
            $hit = Select-String -LiteralPath $f.FullName -Pattern 'tan[i]um' -Quiet -Encoding latin1
            if ($hit) { Fail "clean-room name in $($f.Name) (CR-303)" }
          }
          $msg = & (Join-Path $dist 'usgp-preboot-agent.exe') --self-test 2>&1
          if ($LASTEXITCODE -ne 0) { Fail "staged pair --self-test exited $LASTEXITCODE ($msg)" }
          $sums = @(Get-ChildItem -LiteralPath $dist -File | Sort-Object Name | ForEach-Object {
              "$((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)"
            })
          [IO.File]::WriteAllText((Join-Path $dist 'SHA256SUMS'), (($sums -join "`n") + "`n"))
          $pair = (Get-FileHash -LiteralPath (Join-Path $dist 'SHA256SUMS') -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Join-Path $dist 'PAIR.sha256'), "$pair  SHA256SUMS`n")
          $lines = @('### Agent artifact (exe + FIPS DLL, hashed as a pair)', '```text')
          $lines += "artifact: $name"
          $lines += $sums
          $lines += "pair (sha256 of SHA256SUMS): $pair"
          $lines += "exe imports: $($ei -join ' ')"
          $lines += "self-test from the staged pair: $msg"
          $lines += 'placement: both files in one directory that only the operator can write (impl-notes-wu15, WU-16)'
          $lines += '```'
          $lines | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "dir=$dist" -Encoding utf8
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "name=$name" -Encoding utf8
      - name: Upload the agent pair (CI artifact, not a release)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.agent-artifact.outputs.name }}
          path: ${{ steps.agent-artifact.outputs.dir }}
          if-no-files-found: error
          retention-days: 30

  testing-workspaces:
    # Test-only workspaces (plan WU-9, WU-10): excluded from the product
    # workspace, never shipped, held to the same lint, test and pure-Rust
    # rules. They do not use usgp-crypto, so no FIPS toolchain is needed.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free runner disk (unused preinstalled toolchains; df -h before and after)
        run: scripts/ci-free-disk.sh
      - name: Install Rust from the testing/*/rust-toolchain.toml files
        run: |
          set -euo pipefail
          (cd testing/uefi-payload && rustup toolchain install && rustup show)
          (cd testing/netlab && rustup toolchain install && rustup show)
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/testing
          key: testing-v2-${{ runner.os }}-${{ hashFiles('testing/*/Cargo.lock', 'testing/*/rust-toolchain.toml', 'testing/*/.cargo/config.toml') }}
      - name: uefi-payload format
        working-directory: testing/uefi-payload
        run: cargo fmt --all --check
      - name: uefi-payload clippy (x86_64-unknown-uefi, dev and release)
        working-directory: testing/uefi-payload
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --locked --release -- -D warnings
      - name: uefi-payload library tests on the host
        working-directory: testing/uefi-payload
        run: |
          set -euo pipefail
          host="$(rustc -vV | sed -n 's/^host: //p')"
          cargo clippy --locked --target "$host" --lib --tests -- -D warnings
          cargo test --locked --target "$host" --lib
      - name: uefi-payload build (x86_64-unknown-uefi) and record digests
        working-directory: testing/uefi-payload
        run: |
          set -euo pipefail
          out=../../target/testing/uefi-payload/x86_64-unknown-uefi/release/usgp-test-payload.efi
          cargo build --locked --release
          net="$(sha256sum "$out" | cut -d ' ' -f 1)"
          USGP_PAYLOAD_MARKER=USGP-M1-DISK-FALLBACK-OK cargo build --locked --release
          disk="$(sha256sum "$out" | cut -d ' ' -f 1)"
          {
            echo '### UEFI test payload (test-only, unsigned by design)'
            echo '```text'
            echo "usgp-test-payload.efi (USGP-M1-PAYLOAD-OK)        sha256 $net"
            echo "usgp-test-payload.efi (USGP-M1-DISK-FALLBACK-OK)  sha256 $disk"
            file "$out"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: uefi-payload reproducibility (REL-M1-002; SI-7, SA-10)
        # A clean build into a second target directory must give the same
        # bytes for both markers, so a reviewer can rebuild the payload and
        # match the digest recorded in boot-smoke evidence.
        working-directory: testing/uefi-payload
        run: |
          set -euo pipefail
          rel=x86_64-unknown-uefi/release/usgp-test-payload.efi
          bad=0
          for marker in USGP-M1-PAYLOAD-OK USGP-M1-DISK-FALLBACK-OK; do
            if [ "$marker" = USGP-M1-PAYLOAD-OK ]; then
              unset USGP_PAYLOAD_MARKER
            else
              export USGP_PAYLOAD_MARKER="$marker"
            fi
            cargo build --locked --release
            a="$(sha256sum "../../target/testing/uefi-payload/$rel" | cut -d ' ' -f 1)"
            CARGO_TARGET_DIR="$RUNNER_TEMP/repro" cargo build --locked --release
            b="$(sha256sum "$RUNNER_TEMP/repro/$rel" | cut -d ' ' -f 1)"
            echo "$marker: $a (repo target) $b (second target)"
            if [ "$a" != "$b" ]; then
              echo "::error::usgp-test-payload.efi ($marker) is not reproducible: $a != $b"
              bad=1
            fi
          done
          exit "$bad"
      - name: netlab format, clippy, tests (Linux socket code included)
        working-directory: testing/netlab
        run: |
          cargo fmt --all --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: Pure-Rust check for the testing workspaces
        # Same pattern and allowlist as scripts/check-pure-rust.sh
        # (REL-M1-003: move this into that script).
        run: |
          set -euo pipefail
          pattern='^([A-Za-z0-9_-]+-sys|cc|bindgen|cmake|pkg-config|vcpkg|cxx|cxx-build|link-cplusplus|nasm-rs|openssl-src|autotools) v'
          bad=0
          for ws in testing/uefi-payload testing/netlab; do
            hits="$(cd "$ws" && cargo tree --locked -e normal,build,dev --target all --prefix none \
              | grep -E "$pattern" | awk '{print $1}' | sort -u)" || true
            for h in $hits; do
              if ! grep -qE "^${h}[[:space:]]*(#|$)" scripts/pure-rust-allowlist.txt; then
                echo "::error::$ws depends on $h (pure-Rust rule)"
                bad=1
              fi
            done
          done
          [ "$bad" -eq 0 ] && echo "pure-rust (testing): OK"
          exit "$bad"

  supply-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust from rust-toolchain.toml
        run: |
          set -euo pipefail
          rustup toolchain install && rustup show
          (cd testing/uefi-payload && rustup toolchain install)
          (cd testing/netlab && rustup toolchain install)
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-deny
            ~/.cargo/bin/cargo-audit
          key: supply-chain-tools-${{ runner.os }}-cargo-deny-0.20.2-cargo-audit-0.22.2
      - name: Install cargo-deny and cargo-audit
        run: |
          command -v cargo-deny || cargo install --locked cargo-deny@0.20.2
          command -v cargo-audit || cargo install --locked cargo-audit@0.22.2
      - run: cargo deny --locked check
      - run: cargo audit
      - name: Audit the fuzz workspace lockfile (REL-008)
        # bans and licenses are skipped by design: the fuzz workspace uses
        # libfuzzer-sys (decision 0002), which the main policy bans, and it
        # is never shipped. CR-SR7-006: from the root, fuzz/.cargo/config.toml
        # is not read, so the fuzz build directory is named here; nothing
        # may create fuzz/target/ (decision 0005).
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/fuzz
        run: |
          cargo audit --file fuzz/Cargo.lock
          cargo deny --locked --manifest-path fuzz/Cargo.toml check advisories sources
      - name: Testing workspaces, full policy (plan WU-12)
        # deny.toml is passed explicitly; cargo-deny otherwise looks for it
        # in the current directory.
        run: |
          set -euo pipefail
          for ws in testing/uefi-payload testing/netlab; do
            cargo deny --locked --config deny.toml --manifest-path "$ws/Cargo.toml" check
            cargo audit --file "$ws/Cargo.lock"
          done

  pg-integration:
    # Plan WU-3b; decisions 0008 and 0012. The `pg-integration` tests against
    # PostgreSQL 16 over TLS with certificate-only login. Locally these gates
    # are NOT RUN unless a developer runs scripts/pg-test-setup.sh.
    #
    # The database runs in a digest-pinned postgres:16 container that
    # scripts/pg-test-setup.sh starts, rather than a `services:` entry: a
    # service starts before any step, so it cannot use certificates made in
    # the job, and the image's own entrypoint needs a superuser password or
    # `trust` host access to initialise. Here the test PKI is made in
    # $RUNNER_TEMP (never in the work tree), no role has a password, and TCP
    # opens only once pg_hba.conf is certificate-only. The port is published
    # on 127.0.0.1 only.
    #
    # COMPLIANCE MAPPING:
    # - NIST 800-53: IA-5(2), SC-8(1), CM-6 (checked database configuration),
    #   AU-9 (audit store tests), SI-7 (digest-pinned image)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # <package>:<integration test>. Each must run at least one test, with
      # none ignored, and must fail without the database variables.
      # usgp-server:e2e_pg is the M2 end-to-end flow (plan WU-7). The large
      # upload test is not here: it needs large-tests and its own job.
      PG_REQUIRED_TESTS: usgp-db:migrate_pg usgp-db:repo_pg usgp-db:audit_pg usgp-server:e2e_pg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tests run as a non-root user (SEC-011, decision 0016)
        # `serve` refuses to start if it can open the usgp_admin client key.
        # The tests make that key mode 0000 while `serve` runs and 0600 for
        # the admin commands. Root opens a 0000 file anyway, so as root
        # every `serve` in e2e_pg would be refused (exit 78). Hosted runners
        # run steps as the unprivileged `runner` user; only the container
        # and the scratch directory use sudo. Never run the cargo steps of
        # this job under sudo.
        run: |
          uid="$(id -u)"
          if [ "$uid" -eq 0 ]; then
            echo "::error::pg-integration runs as root (uid 0); the admin-key rule cannot be tested"
            exit 1
          fi
          echo "ok: tests run as $(id -un) (uid $uid)"
      - name: Free runner disk (unused preinstalled toolchains; df -h before and after)
        run: scripts/ci-free-disk.sh
      - uses: ./.github/actions/fips-toolchain
      - name: Install Rust from rust-toolchain.toml
        run: rustup toolchain install && rustup show
      # Split restore and save, as in gates: the save holds dependency
      # artifacts only (scripts/ci-prune-target.sh).
      - name: Restore the cargo cache (registry, git, dependency artifacts)
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: pg-integration-v2-${{ runner.os }}-go${{ env.EXPECT_GO }}-cmake${{ env.EXPECT_CMAKE }}-clang${{ env.EXPECT_CLANG }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Build the pg-integration tests
        run: cargo test --workspace --locked --features pg-integration --no-run
      - name: Without the database variables the pg tests fail, not skip
        run: |
          set -uo pipefail
          if env | grep -q '^USGP_TEST_PG_'; then
            echo "::error::USGP_TEST_PG_* is already set; this step must run without it"
            exit 1
          fi
          bad=0
          for entry in $PG_REQUIRED_TESTS; do
            pkg="${entry%%:*}"
            t="${entry#*:}"
            log="$RUNNER_TEMP/no-db-$t.log"
            status=0
            cargo test -p "$pkg" --locked --features pg-integration --test "$t" > "$log" 2>&1 || status=$?
            if [ "$status" -ne 0 ] && grep -q '^test result: FAILED' "$log"; then
              echo "ok: $pkg $t fails without a database (exit $status)"
            else
              echo "::error::$pkg $t exited $status without a database; it must run and fail (plan WU-3b)"
              tail -n 40 "$log"
              bad=1
            fi
          done
          exit "$bad"
      - name: Start PostgreSQL 16 (TLS, certificate-only login, checked)
        id: pg
        run: |
          set -euo pipefail
          scripts/pg-test-setup.sh up 2>&1 | tee "$RUNNER_TEMP/pg-setup.log"
          # Decision 0016: the admin role's login material must be exported
          # with the owner's and the application role's.
          for v in USGP_TEST_PG_ADMIN_USER USGP_TEST_PG_ADMIN_CERT USGP_TEST_PG_ADMIN_KEY; do
            grep -q "^$v=" "$RUNNER_TEMP/usgp-pg-test/pg-test.env" \
              || { echo "::error::$v missing from pg-test.env"; exit 1; }
          done
          cat "$RUNNER_TEMP/usgp-pg-test/pg-test.env" >> "$GITHUB_ENV"
          {
            echo '### PostgreSQL for pg-integration'
            echo '```text'
            cat "$RUNNER_TEMP/pg-setup.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: pg-integration tests
        # About 1.5 min warm, after the build step above. Bounded so a
        # hung test fails here, named (run 40910029759), and the database
        # check and removal steps still run.
        timeout-minutes: 25
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/pg-tests.log"
          status=0
          cargo test --workspace --locked --features pg-integration 2>&1 | tee "$log" || status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::cargo test --features pg-integration exited $status"
            exit 1
          fi
          # A green run must include every required test binary, each with
          # at least one passing test and none ignored.
          bad=0
          for entry in $PG_REQUIRED_TESTS; do
            t="${entry#*:}"
            # No pipe: see the note in the gates job (run 40815815025).
            line="$(awk -v t="tests/$t.rs" '{ gsub(/\033\[[0-9;]*m/, "") } $1 == "Running" && $2 == t { f = 1; next } f && /^test result:/ { print; exit }' "$log")"
            passed="$(echo "$line" | sed -n 's/.* \([0-9][0-9]*\) passed;.*/\1/p')"
            ignored="$(echo "$line" | sed -n 's/.*; \([0-9][0-9]*\) ignored;.*/\1/p')"
            if [ -z "$line" ] || [ "${passed:-0}" -eq 0 ] || [ "${ignored:-1}" -ne 0 ]; then
              echo "::error::$entry did not run as required (result: '${line:-none}')"
              bad=1
            else
              echo "ok: $entry: $line"
            fi
          done
          exit "$bad"
      - name: Re-check the database configuration after the tests (decision 0012)
        if: ${{ !cancelled() && steps.pg.outcome == 'success' }}
        run: scripts/pg-test-setup.sh check
      - name: PostgreSQL server log (on failure)
        if: ${{ failure() && steps.pg.outcome != 'skipped' }}
        run: docker logs usgp-pg-test 2>&1 | tail -n 200 || true
      - name: Remove the container and the test keys
        if: ${{ always() }}
        run: scripts/pg-test-setup.sh down
      - name: Keep only dependency artifacts for the cache
        if: ${{ steps.cargo-cache.outputs.cache-hit != 'true' }}
        run: scripts/ci-prune-target.sh debug
      - name: Save the cargo cache
        if: ${{ steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  large-upload:
    # Plan WU-10 and section 10 "Large": the M2 exit-1 flow on a synthetic
    # 10.5 GiB, 12-image WIM against PostgreSQL (upload, check, editions,
    # declaration, PE import, package Ready, signed manifests, verified
    # re-download, RSS bound). Scheduled and manual only: it needs about
    # 14 GiB of disk and a long run, so it does not run on every push.
    #
    # Result rule: NOT RUN (test file missing, too little disk, or the
    # test's own NOT RUN marker) fails this job with a "large-upload NOT
    # RUN" annotation. It is never reported as PASS.
    #
    # COMPLIANCE MAPPING:
    # - NIST 800-53: SI-7 (integrity on upload and re-download), SC-5
    #   (bounded memory on large bodies), AU-9, SA-11
    # - Plan WU-10; decisions 0008, 0011, 0012
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      LARGE_MIN_FREE_GIB: "14"
      # The failure message large_upload_pg.rs starts with when the only
      # problem is disk space (its NOT_RUN_DISK constant). Any other failure
      # is FAIL; a run that passes no test is also NOT RUN.
      LARGE_NOT_RUN_MARKER: "NOT RUN: insufficient disk"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require the large upload test (absent is NOT RUN, which fails)
        # Also requires a non-root user, as pg-integration does (SEC-011:
        # root can open the 0000 admin key, so `serve` would refuse).
        run: |
          if [ "$(id -u)" -eq 0 ]; then
            echo "::error::large-upload runs as root (uid 0); the admin-key rule cannot be tested"
            exit 1
          fi
          if [ ! -f services/usgp-server/tests/large_upload_pg.rs ]; then
            echo "::error title=large-upload NOT RUN::services/usgp-server/tests/large_upload_pg.rs does not exist yet (plan WU-10). The large upload did not run. This is not a PASS."
            exit 1
          fi
      - name: Free runner disk (unused preinstalled toolchains; df -h before and after)
        run: scripts/ci-free-disk.sh
      - name: Free-disk preflight (too little space is NOT RUN, which fails)
        # Content root: the larger of the $RUNNER_TEMP file system and /mnt
        # (plan WU-10). Exported as TMPDIR, where the test puts its source
        # image and the server's content root, and checks free space.
        id: disk
        run: |
          set -euo pipefail
          free_gib() { df -P -k "$1" | awk 'NR == 2 { printf "%d", $4 / 1048576 }'; }
          df -h "$RUNNER_TEMP" /mnt 2> /dev/null || true
          root_free="$(free_gib "$RUNNER_TEMP")"
          mnt_free=0
          if [ -d /mnt ]; then mnt_free="$(free_gib /mnt)"; fi
          if [ "$mnt_free" -gt "$root_free" ]; then
            dir=/mnt/usgp-large
            sudo install -d -o "$(id -u)" -g "$(id -g)" -m 0700 "$dir"
            free="$mnt_free"
          else
            dir="$RUNNER_TEMP/usgp-large"
            install -d -m 0700 "$dir"
            free="$root_free"
          fi
          echo "content root $dir: $free GiB free (need $LARGE_MIN_FREE_GIB GiB)"
          if [ "$free" -lt "$LARGE_MIN_FREE_GIB" ]; then
            echo "::error title=large-upload NOT RUN::$free GiB free under $dir, $LARGE_MIN_FREE_GIB GiB needed. The large upload did not run. This is not a PASS."
            exit 1
          fi
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "TMPDIR=$dir" >> "$GITHUB_ENV"
      - uses: ./.github/actions/fips-toolchain
      - name: Install Rust from rust-toolchain.toml
        run: rustup toolchain install && rustup show
      # Registry only: a cached release target/ would take the disk the
      # test needs when the content root shares the root file system.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: large-upload-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Build the large upload test (release)
        run: cargo test -p usgp-server --release --locked --features pg-integration,large-tests --test large_upload_pg --no-run
      - name: Re-check free disk after the build
        env:
          CONTENT_DIR: ${{ steps.disk.outputs.dir }}
        run: |
          set -euo pipefail
          free="$(df -P -k "$CONTENT_DIR" | awk 'NR == 2 { printf "%d", $4 / 1048576 }')"
          echo "content root $CONTENT_DIR: $free GiB free after the build"
          if [ "$free" -lt "$LARGE_MIN_FREE_GIB" ]; then
            echo "::error title=large-upload NOT RUN::$free GiB free under $CONTENT_DIR after the build, $LARGE_MIN_FREE_GIB GiB needed. The large upload did not run. This is not a PASS."
            exit 1
          fi
      - name: Start PostgreSQL 16 (TLS, certificate-only login, checked)
        id: pg
        run: |
          set -euo pipefail
          scripts/pg-test-setup.sh up 2>&1 | tee "$RUNNER_TEMP/pg-setup.log"
          # Decision 0016: the admin role's login material (large_upload_pg
          # enrols the operator and verifies the audit chain as usgp_admin).
          for v in USGP_TEST_PG_ADMIN_USER USGP_TEST_PG_ADMIN_CERT USGP_TEST_PG_ADMIN_KEY; do
            grep -q "^$v=" "$RUNNER_TEMP/usgp-pg-test/pg-test.env" \
              || { echo "::error::$v missing from pg-test.env"; exit 1; }
          done
          cat "$RUNNER_TEMP/usgp-pg-test/pg-test.env" >> "$GITHUB_ENV"
      - name: Large upload test (exit-1 flow; NOT RUN is never PASS)
        timeout-minutes: 180
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/large-upload.log"
          status=0
          cargo test -p usgp-server --release --locked --features pg-integration,large-tests \
            --test large_upload_pg -- --nocapture 2>&1 | tee "$log" || status=$?
          # No pipe: see the note in the gates job (run 40815815025).
          line="$(awk '{ gsub(/\033\[[0-9;]*m/, "") } $1 == "Running" && $2 == "tests/large_upload_pg.rs" { f = 1; next } f && /^test result:/ { print; exit }' "$log")"
          passed="$(echo "$line" | sed -n 's/.* \([0-9][0-9]*\) passed;.*/\1/p')"
          ignored="$(echo "$line" | sed -n 's/.*; \([0-9][0-9]*\) ignored;.*/\1/p')"
          {
            echo '### large-upload result'
            echo '```text'
            echo "exit $status; ${line:-no test result line}"
            df -h "$TMPDIR" | tail -n 1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if grep -qF -- "$LARGE_NOT_RUN_MARKER" "$log"; then
            echo "::error title=large-upload NOT RUN::the test reported NOT RUN ($LARGE_NOT_RUN_MARKER). This is not a PASS."
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            echo "::error title=large-upload FAIL::cargo test exited $status"
            exit 1
          fi
          if [ -z "$line" ] || [ "${passed:-0}" -eq 0 ] || [ "${ignored:-1}" -ne 0 ]; then
            echo "::error title=large-upload NOT RUN::large_upload_pg did not pass a test (result: '${line:-none}'). This is not a PASS."
            exit 1
          fi
          echo "large-upload: PASS ($line)"
      - name: Re-check the database configuration after the test (decision 0012)
        if: ${{ !cancelled() && steps.pg.outcome == 'success' }}
        run: scripts/pg-test-setup.sh check
      - name: PostgreSQL server log (on failure)
        if: ${{ failure() && steps.pg.outcome != 'skipped' }}
        run: docker logs usgp-pg-test 2>&1 | tail -n 200 || true
      - name: Remove the container, the test keys and the content root
        if: ${{ always() }}
        env:
          CONTENT_DIR: ${{ steps.disk.outputs.dir }}
        run: |
          scripts/pg-test-setup.sh down || true
          if [ -n "$CONTENT_DIR" ]; then
            rm -rf -- "$CONTENT_DIR" 2> /dev/null || sudo rm -rf -- "$CONTENT_DIR"
          fi

  markdown:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Node and npm come with the runner image (not pinned; REL-008).
      # markdownlint-cli 0.45.0 and every transitive dependency are pinned
      # with integrity hashes in .github/markdownlint/package-lock.json.
      - name: Install markdownlint from the lockfile (REL-008)
        working-directory: .github/markdownlint
        run: npm ci --ignore-scripts --no-audit --no-fund
      - run: .github/markdownlint/node_modules/.bin/markdownlint --version
      - run: >-
          .github/markdownlint/node_modules/.bin/markdownlint "docs/**/*.md" "specs/**/*.md"
          "fuzz/*.md" "fuzz/corpus/**/*.md" "testing/**/*.md" "*.md"

  ci-lint:
    # shellcheck for scripts/ (includes boot-smoke.sh and gates.sh),
    # actionlint for workflows (REL-008).
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SHELLCHECK_VERSION: "0.9.0"
      ACTIONLINT_VERSION: "1.7.7"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install shellcheck (noble archive, version asserted)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
          got="$(shellcheck --version | sed -n 's/^version: //p')"
          [ "$got" = "$SHELLCHECK_VERSION" ] || { echo "::error::shellcheck is $got, expected $SHELLCHECK_VERSION"; exit 1; }
      - name: Install actionlint (Go module, checksums verified by sum.golang.org)
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install "github.com/rhysd/actionlint/cmd/actionlint@v${ACTIONLINT_VERSION}"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: shellcheck scripts/*.sh
      - run: actionlint -version && actionlint

  fuzz-build:
    # Separate workspace; libFuzzer allowed only here (decision 0002).
    # Build output is target/fuzz (fuzz/.cargo/config.toml, decision 0005).
    # Since M2 the fuzz workspace links usgp-crypto (through usgp-image and
    # usgp-proto), so it builds the AWS-LC FIPS module and needs the pinned
    # FIPS toolchain like every other job that builds usgp-crypto.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/fips-toolchain
      - name: Install pinned nightly from fuzz/rust-toolchain.toml
        working-directory: fuzz
        run: rustup toolchain install && rustup show
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-fuzz
            ~/.cargo/registry
            target/fuzz
          key: fuzz-v2-${{ runner.os }}-cargo-fuzz-0.13.2-go${{ env.EXPECT_GO }}-cmake${{ env.EXPECT_CMAKE }}-clang${{ env.EXPECT_CLANG }}-${{ hashFiles('fuzz/Cargo.toml', 'fuzz/Cargo.lock', 'fuzz/rust-toolchain.toml', 'fuzz/.cargo/config.toml') }}
      - name: Install cargo-fuzz
        run: command -v cargo-fuzz || cargo install --locked cargo-fuzz@0.13.2
      - name: Check fuzz/Cargo.lock is up to date (REL-008)
        working-directory: fuzz
        run: cargo fetch --locked
      - name: Format and lint with the pinned nightly
        working-directory: fuzz
        run: |
          cargo fmt --all --check
          cargo clippy --locked --all-targets -- -D warnings
      - name: Build fuzz targets
        working-directory: fuzz
        # --sanitizer none on Linux: AWS-LC FIPS (linked through usgp-crypto)
        # cannot be built with AddressSanitizer, because its delocate step
        # rejects ASan's GOTPCREL code (CI run 40599553698). libFuzzer
        # coverage, panic, timeout and RSS-limit detection are unchanged;
        # every fuzzed crate forbids unsafe code. Local macOS gates keep
        # ASan. Build and run must use the same flag, or run rebuilds.
        run: cargo fuzz build --sanitizer none
      - name: Replay the committed seeds (regression, no new inputs)
        # Every target in fuzz/fuzz_targets/ must be listed here; a target
        # without a replay fails this step.
        working-directory: fuzz
        run: |
          set -euo pipefail
          targets="dhcp_packet tftp_packet wim_header wim_xml wim_lookup wim_check xpress_chunk api_json"
          # M3 plan WU-14.
          targets="$targets gpt_readback efi_load_option wim_metadata wim_apply_plan tftp_window"
          targets="$targets tftp_name device_session_msgs job_plan boot_manifest pe_coff"
          targets="$targets agent_config relay_boot_policy relay_feed_url"
          # M3 fix round 1 (NIST-011).
          targets="$targets agent_http_head"
          # M3 fix round 1 (SEC-004).
          targets="$targets winapi_sd winapi_reparse"
          for f in fuzz_targets/*.rs; do
            t="$(basename "$f" .rs)"
            case " $targets " in
              *" $t "*) ;;
              *) echo "::error::fuzz target $t has no seed replay in ci.yml"; exit 1 ;;
            esac
          done
          for t in $targets; do
            cargo fuzz run --sanitizer none "$t" "corpus/$t" -- -runs=0 -rss_limit_mb=2048 -timeout=10
          done

  fuzz-smoke:
    # Each target runs for its plan length with no crash, OOM or timeout:
    # M1 exit criterion 3 (dhcp_packet, tftp_packet, 600 s) and M2 plan
    # section 10 (wim_header, wim_xml, xpress_chunk 600 s; wim_lookup,
    # wim_check, api_json 60 s smoke) and the M3 WU-14 targets: 600 s for
    # the six that parse network or file input (plan M3 section 10.1:
    # wim_metadata, wim_apply_plan, gpt_readback, device_session_msgs,
    # job_plan, tftp_window), 60 s smoke for the rest; all with
    # -rss_limit_mb=2048 -timeout=10 (impl-notes-wu9).
    # Scheduled and manual only; fuzz-build replays the seeds on every
    # change. Each matrix job builds the FIPS module too, hence the
    # toolchain step and the longer timeout.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # -max_len lets the DHCP fuzzer reach the over-length (> 1472 octet)
          # path; TFTP transfer scripts need more room (impl-notes-wu8). The
          # M2 lengths are from impl-notes-wu9 (wim_check seeds reach 213 KB).
          - target: dhcp_packet
            max_len: 1600
            secs: 600
          - target: tftp_packet
            max_len: 4096
            secs: 600
          - target: wim_header
            max_len: 1024
            secs: 600
          - target: wim_xml
            max_len: 16384
            secs: 600
          - target: xpress_chunk
            max_len: 70000
            secs: 600
          - target: wim_lookup
            max_len: 4096
            secs: 60
          - target: wim_check
            max_len: 262144
            secs: 60
          - target: api_json
            max_len: 70000
            secs: 60
          # M3 plan WU-14 targets (impl-notes-wu14); 600 s for the six
          # network and file parsers (plan section 10.1, WU-15), 60 s smoke
          # for the others.
          - target: gpt_readback
            max_len: 65536
            secs: 600
          - target: efi_load_option
            max_len: 8192
            secs: 60
          - target: wim_metadata
            max_len: 65536
            secs: 600
          - target: wim_apply_plan
            max_len: 65536
            secs: 600
          - target: tftp_window
            max_len: 1024
            secs: 600
          - target: tftp_name
            max_len: 512
            secs: 60
          - target: device_session_msgs
            max_len: 16384
            secs: 600
          - target: job_plan
            max_len: 16384
            secs: 600
          - target: boot_manifest
            max_len: 16384
            secs: 60
          - target: pe_coff
            max_len: 4096
            secs: 60
          - target: agent_config
            max_len: 4096
            secs: 60
          - target: relay_boot_policy
            max_len: 256
            secs: 60
          - target: relay_feed_url
            max_len: 1024
            secs: 60
          # NIST-011: the agent's response head (16 KiB head limit plus
          # room for the selector and a partial body).
          - target: agent_http_head
            max_len: 16448
            secs: 60
          # SEC-004: descriptors (the 64 KiB parser limit) and reparse
          # buffers (header plus a few names).
          - target: winapi_sd
            max_len: 65536
            secs: 60
          - target: winapi_reparse
            max_len: 4096
            secs: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/fips-toolchain
      - name: Install pinned nightly from fuzz/rust-toolchain.toml
        working-directory: fuzz
        run: rustup toolchain install && rustup show
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-fuzz
            ~/.cargo/registry
            target/fuzz
          key: fuzz-v2-${{ runner.os }}-cargo-fuzz-0.13.2-go${{ env.EXPECT_GO }}-cmake${{ env.EXPECT_CMAKE }}-clang${{ env.EXPECT_CLANG }}-${{ hashFiles('fuzz/Cargo.toml', 'fuzz/Cargo.lock', 'fuzz/rust-toolchain.toml', 'fuzz/.cargo/config.toml') }}
      - name: Install cargo-fuzz
        run: command -v cargo-fuzz || cargo install --locked cargo-fuzz@0.13.2
      - name: Fuzz ${{ matrix.target }} for ${{ matrix.secs }} s
        working-directory: fuzz
        env:
          TARGET: ${{ matrix.target }}
          MAX_LEN: ${{ matrix.max_len }}
          RUN_SECS: ${{ matrix.secs }}
        run: |
          set -euo pipefail
          cargo fetch --locked
          mkdir -p "artifacts/$TARGET" "$RUNNER_TEMP/work/$TARGET"
          # Scratch working corpus first, so new inputs (no recorded origin)
          # never land in fuzz/corpus/ (CONTRIBUTING.md test-data rule).
          cargo fuzz run --sanitizer none "$TARGET" "$RUNNER_TEMP/work/$TARGET" "corpus/$TARGET" -- \
            -max_total_time="$RUN_SECS" -max_len="$MAX_LEN" -rss_limit_mb=2048 -timeout=10 \
            -print_final_stats=1 \
            2>&1 | tee "artifacts/$TARGET/fuzz.log"
          # libFuzzer exits 0 when time runs out. Require the full run
          # length, so an early stop is never reported as a pass.
          secs="$(sed -n 's/^Done [0-9]* runs in \([0-9]*\) second.*/\1/p' "artifacts/$TARGET/fuzz.log" | tail -n 1)"
          if [ -z "$secs" ] || [ "$secs" -lt "$RUN_SECS" ]; then
            echo "::error::$TARGET ran ${secs:-unknown} s, expected at least $RUN_SECS s"
            exit 1
          fi
          {
            echo "### fuzz-smoke $TARGET ($RUN_SECS s, -max_len=$MAX_LEN)"
            echo '```text'
            grep -E '^(Done|stat::)' "artifacts/$TARGET/fuzz.log" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload fuzz log and any crash, OOM or timeout inputs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-smoke-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: warn
          retention-days: 30

  boot-smoke:
    # M1 exits 1, 2 (in QEMU), 4 (binding) and 5 (plan section 10.5; owner
    # approval Q-5). Linux with root: network namespaces, bridges and taps.
    # M3 (plan section 10.3, QA-002): S9, the BOOT-5 stop through the real
    # server on PostgreSQL, the relay's signed feed and the simulated agent;
    # S10, OVMF boots GPTs written by usgp-disk (GPT-OBS-002, OPEN-GPT-1).
    # Exit 0 is PASS; 1 is FAIL; 77 is NOT RUN and fails this job (see the
    # result rule at the top of this file).
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free runner disk (unused preinstalled toolchains; df -h before and after)
        run: scripts/ci-free-disk.sh
      - uses: ./.github/actions/fips-toolchain
        with:
          # dosfstools, mtools: FAT on the S9 and S10 disks; gdisk: sgdisk -v,
          # an independent check of our GPT (S9, S10).
          extra-packages: qemu-system-x86 ovmf iproute2 dosfstools mtools gdisk
      - name: Install Rust (product and testing toolchain files)
        run: |
          set -euo pipefail
          rustup toolchain install && rustup show
          (cd testing/uefi-payload && rustup toolchain install)
          (cd testing/netlab && rustup toolchain install)
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release
            target/testing
          key: boot-smoke-${{ runner.os }}-go${{ env.EXPECT_GO }}-cmake${{ env.EXPECT_CMAKE }}-clang${{ env.EXPECT_CLANG }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'testing/*/Cargo.lock', 'testing/*/rust-toolchain.toml') }}
      - name: Enable KVM for the runner user when /dev/kvm exists
        run: |
          set -euo pipefail
          if [ -e /dev/kvm ]; then
            # Ephemeral runner VM: the QEMU user ($SUDO_USER) needs /dev/kvm.
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
              | sudo tee /etc/udev/rules.d/99-usgp-kvm.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
            ls -l /dev/kvm
          else
            echo "::warning::/dev/kvm not present; the harness falls back to TCG (longer deadlines)"
          fi
      - name: Record and check the lab packages and firmware files
        # The harness defaults are the Ubuntu ovmf package paths (plan
        # section 10.5). A missing file is configuration drift: fail here
        # instead of letting the harness report NOT RUN.
        run: |
          set -euo pipefail
          fw="/usr/share/OVMF/OVMF_CODE_4M.fd /usr/share/OVMF/OVMF_VARS_4M.fd /usr/share/OVMF/OVMF_CODE_4M.secboot.fd /usr/share/OVMF/OVMF_VARS_4M.ms.fd"
          {
            echo '### Boot smoke environment'
            echo '```text'
            dpkg-query -W qemu-system-x86 ovmf iproute2 dosfstools mtools gdisk
            qemu-system-x86_64 --version | head -n 1
            for f in $fw; do
              if [ -f "$f" ]; then sha256sum "$f"; else echo "MISSING $f"; fi
            done
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          for f in $fw; do
            [ -f "$f" ] || { echo "::error::firmware file $f not installed by the ovmf package"; exit 1; }
          done
      - name: Build relay, cli, server, agent, netlab and payloads (as the runner user)
        run: scripts/boot-smoke.sh build
      - name: Start PostgreSQL 16 for S9 (TLS, certificate-only login, checked)
        # The same digest-pinned container and throwaway PKI as
        # pg-integration (decisions 0008, 0012, 0016), started as the runner
        # user before the harness; sudo -E passes USGP_TEST_PG_* to it.
        id: pg
        run: |
          set -euo pipefail
          if [ "$(id -u)" -eq 0 ]; then
            echo "::error::boot-smoke runs as root; usgp-server's admin-key rule needs a normal user"
            exit 1
          fi
          scripts/pg-test-setup.sh up 2>&1 | tee "$RUNNER_TEMP/pg-setup.log"
          cat "$RUNNER_TEMP/usgp-pg-test/pg-test.env" >> "$GITHUB_ENV"
      - name: Boot smoke (root; exit 77 is NOT RUN, never PASS)
        timeout-minutes: 120
        env:
          USGP_BOOT_SMOKE_OUT: ${{ github.workspace }}/target/boot-smoke/ci-run
        run: |
          set -uo pipefail
          status=0
          # -E keeps USGP_*; sudo sets SUDO_USER, which becomes the QEMU user.
          sudo -E scripts/boot-smoke.sh all 2>&1 | tee target/boot-smoke/console.log || status=$?
          {
            echo '### Boot smoke result'
            echo '```text'
            sed -n '/boot-smoke summary/,$p' target/boot-smoke/console.log
            echo "exit $status"
            echo '```'
            echo '### GPT-OBS-002 (S10: OVMF and GPTs written by usgp-disk)'
            echo '```text'
            cat "$USGP_BOOT_SMOKE_OUT/s10/gpt-obs-002.txt" 2> /dev/null || echo "S10 wrote no record (see the summary above)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          case "$status" in
            0) echo "boot-smoke: PASS (every scenario passed)" ;;
            77)
              echo "::error title=boot-smoke NOT RUN::exit 77: no scenario failed, but at least one was NOT RUN. This is not a PASS; see the job summary and the boot-smoke-evidence artifact."
              exit 1
              ;;
            1)
              echo "::error title=boot-smoke FAIL::at least one scenario (or preflight) failed; see the boot-smoke-evidence artifact."
              exit 1
              ;;
            *)
              echo "::error title=boot-smoke error::harness exited $status"
              exit 1
              ;;
          esac
      - name: Re-check the database configuration and remove it (decision 0012)
        if: ${{ always() && steps.pg.outcome != 'skipped' }}
        env:
          PG_OUTCOME: ${{ steps.pg.outcome }}
        run: |
          status=0
          if [ "$PG_OUTCOME" = success ]; then
            scripts/pg-test-setup.sh check || status=$?
          fi
          scripts/pg-test-setup.sh down || true
          exit "$status"
      - name: Name scan of the release binaries, payloads and evidence (CR-303)
        # Runs even when the boot smoke failed, so the evidence can still be
        # uploaded. No exclusions; exit 1 on a hit, exit 2 if an artifact is
        # missing or unreadable.
        id: artifact-names
        if: ${{ !cancelled() }}
        run: scripts/check-artifact-names.sh
      - name: Upload boot smoke evidence (serial logs, relay JSON logs, summary)
        # Only after a clean name scan: nothing that fails the clean-room name
        # rule leaves the runner (CR-303). The job log keeps the scan output.
        if: ${{ !cancelled() && steps.artifact-names.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: boot-smoke-evidence
          path: target/boot-smoke/
          if-no-files-found: warn
          retention-days: 30
