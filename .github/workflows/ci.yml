# CI gates (see .claude/skills/provision-workflow/references/quality-gates.md).
# Third-party actions are pinned by full commit SHA (supply chain, SR-4).
#
# Result rule (all jobs): a gate that did not run is never reported as PASS.
# The boot smoke harness exits 77 for NOT RUN; the boot-smoke job turns that
# into a failed job with a "NOT RUN" annotation, because GitHub Actions has no
# neutral job state and a green job reads as PASS.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly re-run so new RustSec advisories surface without a code change.
    # Also the trigger for the fuzz-smoke and large-upload jobs.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Decision 0001: always build the FIPS module from the crate's bundled
  # source. Disable auto-detection of a system AWS-LC/OpenSSL install
  # (OPENSSL_DIR, pkg-config), which the -sys build scripts otherwise probe
  # and may load and execute. Linux FIPS builds are static; pin that.
  AWS_LC_FIPS_SYS_USE_SYSTEM: "0"
  AWS_LC_SYS_USE_SYSTEM: "0"
  AWS_LC_FIPS_SYS_STATIC: "1"

jobs:
  gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/fips-toolchain
        with:
          extra-packages: ripgrep
      - name: Install Rust from rust-toolchain.toml
        run: rustup toolchain install && rustup show
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: gates-${{ runner.os }}-go${{ env.EXPECT_GO }}-cmake${{ env.EXPECT_CMAKE }}-clang${{ env.EXPECT_CLANG }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy with the test-only features (lint only, never run here)
        # Lints the code behind test-pki, testkit, dism-samples,
        # pg-integration and large-tests. The dism-samples and pg tests fail
        # by design without their data, so this job never runs them.
        run: >-
          cargo clippy --workspace --all-targets --locked
          --features test-pki,testkit,dism-samples,pg-integration,large-tests
          -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo test --workspace --doc --locked
      - name: Feature-gated test evidence (usgp-crypto test-pki, usgp-image testkit)
        # Per package, so the mTLS (REQ-RBAC-005, REQ-IMG-053) and WIM
        # negative/XPRESS (REQ-IMG-037/038) tests do not depend on another
        # crate's dev-dependency features. Each named test binary must run
        # at least one test with none ignored. Never --all-features for
        # usgp-image here: dism-samples fails without USGP_WIM_SAMPLES.
        run: |
          set -uo pipefail
          bad=0
          # require <log> <test file stem>...
          require() {
            local log=$1 t line passed ignored
            shift
            for t in "$@"; do
              line="$(sed 's/\x1b\[[0-9;]*m//g' "$log" | awk -v t="tests/$t.rs" '$1 == "Running" && $2 == t { f = 1; next } f && /^test result:/ { print; exit }')"
              passed="$(echo "$line" | sed -n 's/.* \([0-9][0-9]*\) passed;.*/\1/p')"
              ignored="$(echo "$line" | sed -n 's/.*; \([0-9][0-9]*\) ignored;.*/\1/p')"
              if [ -z "$line" ] || [ "${passed:-0}" -eq 0 ] || [ "${ignored:-1}" -ne 0 ]; then
                echo "::error::tests/$t.rs did not run as required (result: '${line:-none}')"
                bad=1
              else
                echo "ok: $t: $line"
              fi
            done
          }
          # run_feature <log name> <cargo test args...>
          run_feature() {
            local log="$RUNNER_TEMP/$1.log" status=0
            shift
            cargo test --locked "$@" 2>&1 | tee "$log" || status=$?
            if [ "$status" -ne 0 ]; then
              echo "::error::cargo test $* exited $status"
              bad=1
            fi
          }
          run_feature crypto-test-pki -p usgp-crypto --features test-pki
          require "$RUNNER_TEMP/crypto-test-pki.log" tls_mtls envelope sign
          run_feature image-testkit -p usgp-image --features testkit
          require "$RUNNER_TEMP/image-testkit.log" check negative xpress_vectors
          exit "$bad"
      - name: Shipped builds enable no test-only feature (SI-7, CM-7)
        # The graph `cargo build --workspace --bins --release` resolves
        # (normal and build edges, no dev) must not turn on test-pki (and
        # its x509-cert builder), testkit, dism-samples, pg-integration or
        # large-tests.
        run: |
          set -euo pipefail
          hits="$(cargo tree --locked --workspace -e features,normal,build --target all --prefix none \
            | grep -E '(feature "(test-pki|testkit|dism-samples|pg-integration|large-tests)"|^x509-cert feature "builder")' \
            | sort -u)" || true
          if [ -n "$hits" ]; then
            echo "::error::test-only features reach the shipped build graph:"
            echo "$hits"
            exit 1
          fi
          echo "test-only features: none in the shipped build graph"
      - run: scripts/check-pure-rust.sh
      - run: scripts/check-names.sh
      - run: NAMES_FORCE_GREP=1 scripts/check-names.sh
      - run: scripts/test-check-names.sh
      # REQ-PE-001 (finding QA-001): no Windows PE / ADK file or WIM image in
      # the repository, and the gate's own 43 positive/negative cases. The
      # shipped-artifact half runs in fips-linkage and boot-smoke.
      - run: scripts/check-pe-files.sh repo
      - run: scripts/test-check-pe-files.sh
      - name: Binaries start in FIPS mode (fail closed, SC-13; start-up contract, plan section 3.6)
        run: |
          set -euo pipefail
          cargo build --workspace --bins --locked
          # Run the artifacts directly (not via cargo run) so a missing
          # runtime library fails here.
          for b in usgp-preboot-agent usgp-cli; do
            "target/debug/$b"
          done
          # The relay's and the server's FIPS-check-only mode; with no
          # arguments each prints usage and exits 2, which must not be
          # mistaken for a pass.
          for b in usgp-relay usgp-server; do
            "target/debug/$b" --self-check
            status=0
            "target/debug/$b" 2> /dev/null || status=$?
            if [ "$status" -ne 2 ]; then
              echo "::error::$b with no arguments exited $status, expected 2 (usage)"
              exit 1
            fi
          done

  fips-linkage:
    # Decision 0001 Amendment 1: shipped binaries link the FIPS module, do not
    # link the non-FIPS AWS-LC library, and report FIPS mode active.
    # Also the release-artifact name scan (CR-303, decision 0005).
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/fips-toolchain
      - name: Install Rust (product and testing toolchain files)
        run: |
          set -euo pipefail
          rustup toolchain install && rustup show
          (cd testing/uefi-payload && rustup toolchain install)
          (cd testing/netlab && rustup toolchain install)
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-${{ runner.os }}-go${{ env.EXPECT_GO }}-cmake${{ env.EXPECT_CMAKE }}-clang${{ env.EXPECT_CLANG }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'testing/*/Cargo.lock', 'testing/*/rust-toolchain.toml') }}
      - name: Stage the UEFI payloads (as the runner user)
        # Stages the two .efi files the artifact scan requires. It also
        # builds the relay and cli with -p; the workspace build below runs
        # after it, so the linkage check and the name scan both see the
        # workspace release binaries.
        run: scripts/boot-smoke.sh build
      - run: cargo build --workspace --bins --release --locked
      # Runs usgp-relay with --self-check (bin_args in the script).
      - run: scripts/check-fips-linkage.sh release
      - name: Name scan of the release binaries and staged payloads (CR-303)
        # No exclusions; exit 1 on a hit, exit 2 if an artifact is missing.
        # Also runs check-pe-files.sh (REQ-PE-001) on the relay, the cli and
        # the payloads.
        run: scripts/check-artifact-names.sh
      - name: Every shipped binary, name scan and REQ-PE-001 (CR-303, QA-001)
        # check-artifact-names.sh lists only the relay and the cli
        # (REL-M2-P6-001); this covers all four release binaries. Fails
        # closed: a missing binary is exit 2 from check-pe-files.sh.
        run: |
          set -euo pipefail
          bins=(target/release/usgp-server target/release/usgp-relay
            target/release/usgp-preboot-agent target/release/usgp-cli)
          scripts/check-pe-files.sh files "${bins[@]}"
          hits="$(LC_ALL=C grep -a -i -l -E -e 'tan[i]um' -- "${bins[@]}" || true)"
          if [ -n "$hits" ]; then
            echo "::error::clean-room name in: $hits"
            exit 1
          fi
          echo "shipped binaries: name scan and REQ-PE-001 OK (${#bins[@]} files)"

  testing-workspaces:
    # Test-only workspaces (plan WU-9, WU-10): excluded from the product
    # workspace, never shipped, held to the same lint, test and pure-Rust
    # rules. They do not use usgp-crypto, so no FIPS toolchain is needed.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust from the testing/*/rust-toolchain.toml files
        run: |
          set -euo pipefail
          (cd testing/uefi-payload && rustup toolchain install && rustup show)
          (cd testing/netlab && rustup toolchain install && rustup show)
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/testing
          key: testing-${{ runner.os }}-${{ hashFiles('testing/*/Cargo.lock', 'testing/*/rust-toolchain.toml', 'testing/*/.cargo/config.toml') }}
      - name: uefi-payload format
        working-directory: testing/uefi-payload
        run: cargo fmt --all --check
      - name: uefi-payload clippy (x86_64-unknown-uefi, dev and release)
        working-directory: testing/uefi-payload
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --locked --release -- -D warnings
      - name: uefi-payload library tests on the host
        working-directory: testing/uefi-payload
        run: |
          set -euo pipefail
          host="$(rustc -vV | sed -n 's/^host: //p')"
          cargo clippy --locked --target "$host" --lib --tests -- -D warnings
          cargo test --locked --target "$host" --lib
      - name: uefi-payload build (x86_64-unknown-uefi) and record digests
        working-directory: testing/uefi-payload
        run: |
          set -euo pipefail
          out=../../target/testing/uefi-payload/x86_64-unknown-uefi/release/usgp-test-payload.efi
          cargo build --locked --release
          net="$(sha256sum "$out" | cut -d ' ' -f 1)"
          USGP_PAYLOAD_MARKER=USGP-M1-DISK-FALLBACK-OK cargo build --locked --release
          disk="$(sha256sum "$out" | cut -d ' ' -f 1)"
          {
            echo '### UEFI test payload (test-only, unsigned by design)'
            echo '```text'
            echo "usgp-test-payload.efi (USGP-M1-PAYLOAD-OK)        sha256 $net"
            echo "usgp-test-payload.efi (USGP-M1-DISK-FALLBACK-OK)  sha256 $disk"
            file "$out"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: uefi-payload reproducibility (REL-M1-002; SI-7, SA-10)
        # A clean build into a second target directory must give the same
        # bytes for both markers, so a reviewer can rebuild the payload and
        # match the digest recorded in boot-smoke evidence.
        working-directory: testing/uefi-payload
        run: |
          set -euo pipefail
          rel=x86_64-unknown-uefi/release/usgp-test-payload.efi
          bad=0
          for marker in USGP-M1-PAYLOAD-OK USGP-M1-DISK-FALLBACK-OK; do
            if [ "$marker" = USGP-M1-PAYLOAD-OK ]; then
              unset USGP_PAYLOAD_MARKER
            else
              export USGP_PAYLOAD_MARKER="$marker"
            fi
            cargo build --locked --release
            a="$(sha256sum "../../target/testing/uefi-payload/$rel" | cut -d ' ' -f 1)"
            CARGO_TARGET_DIR="$RUNNER_TEMP/repro" cargo build --locked --release
            b="$(sha256sum "$RUNNER_TEMP/repro/$rel" | cut -d ' ' -f 1)"
            echo "$marker: $a (repo target) $b (second target)"
            if [ "$a" != "$b" ]; then
              echo "::error::usgp-test-payload.efi ($marker) is not reproducible: $a != $b"
              bad=1
            fi
          done
          exit "$bad"
      - name: netlab format, clippy, tests (Linux socket code included)
        working-directory: testing/netlab
        run: |
          cargo fmt --all --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: Pure-Rust check for the testing workspaces
        # Same pattern and allowlist as scripts/check-pure-rust.sh
        # (REL-M1-003: move this into that script).
        run: |
          set -euo pipefail
          pattern='^([A-Za-z0-9_-]+-sys|cc|bindgen|cmake|pkg-config|vcpkg|cxx|cxx-build|link-cplusplus|nasm-rs|openssl-src|autotools) v'
          bad=0
          for ws in testing/uefi-payload testing/netlab; do
            hits="$(cd "$ws" && cargo tree --locked -e normal,build,dev --target all --prefix none \
              | grep -E "$pattern" | awk '{print $1}' | sort -u)" || true
            for h in $hits; do
              if ! grep -qE "^${h}[[:space:]]*(#|$)" scripts/pure-rust-allowlist.txt; then
                echo "::error::$ws depends on $h (pure-Rust rule)"
                bad=1
              fi
            done
          done
          [ "$bad" -eq 0 ] && echo "pure-rust (testing): OK"
          exit "$bad"

  supply-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust from rust-toolchain.toml
        run: |
          set -euo pipefail
          rustup toolchain install && rustup show
          (cd testing/uefi-payload && rustup toolchain install)
          (cd testing/netlab && rustup toolchain install)
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-deny
            ~/.cargo/bin/cargo-audit
          key: supply-chain-tools-${{ runner.os }}-cargo-deny-0.20.2-cargo-audit-0.22.2
      - name: Install cargo-deny and cargo-audit
        run: |
          command -v cargo-deny || cargo install --locked cargo-deny@0.20.2
          command -v cargo-audit || cargo install --locked cargo-audit@0.22.2
      - run: cargo deny --locked check
      - run: cargo audit
      - name: Audit the fuzz workspace lockfile (REL-008)
        # bans and licenses are skipped by design: the fuzz workspace uses
        # libfuzzer-sys (decision 0002), which the main policy bans, and it
        # is never shipped.
        run: |
          cargo audit --file fuzz/Cargo.lock
          cargo deny --locked --manifest-path fuzz/Cargo.toml check advisories sources
      - name: Testing workspaces, full policy (plan WU-12)
        # deny.toml is passed explicitly; cargo-deny otherwise looks for it
        # in the current directory.
        run: |
          set -euo pipefail
          for ws in testing/uefi-payload testing/netlab; do
            cargo deny --locked --config deny.toml --manifest-path "$ws/Cargo.toml" check
            cargo audit --file "$ws/Cargo.lock"
          done

  pg-integration:
    # Plan WU-3b; decisions 0008 and 0012. The `pg-integration` tests against
    # PostgreSQL 16 over TLS with certificate-only login. Locally these gates
    # are NOT RUN unless a developer runs scripts/pg-test-setup.sh.
    #
    # The database runs in a digest-pinned postgres:16 container that
    # scripts/pg-test-setup.sh starts, rather than a `services:` entry: a
    # service starts before any step, so it cannot use certificates made in
    # the job, and the image's own entrypoint needs a superuser password or
    # `trust` host access to initialise. Here the test PKI is made in
    # $RUNNER_TEMP (never in the work tree), no role has a password, and TCP
    # opens only once pg_hba.conf is certificate-only. The port is published
    # on 127.0.0.1 only.
    #
    # COMPLIANCE MAPPING:
    # - NIST 800-53: IA-5(2), SC-8(1), CM-6 (checked database configuration),
    #   AU-9 (audit store tests), SI-7 (digest-pinned image)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # <package>:<integration test>. Each must run at least one test, with
      # none ignored, and must fail without the database variables.
      # usgp-server:e2e_pg is the M2 end-to-end flow (plan WU-7). The large
      # upload test is not here: it needs large-tests and its own job.
      PG_REQUIRED_TESTS: usgp-db:migrate_pg usgp-db:repo_pg usgp-db:audit_pg usgp-server:e2e_pg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tests run as a non-root user (SEC-011, decision 0016)
        # `serve` refuses to start if it can open the usgp_admin client key.
        # The tests make that key mode 0000 while `serve` runs and 0600 for
        # the admin commands. Root opens a 0000 file anyway, so as root
        # every `serve` in e2e_pg would be refused (exit 78). Hosted runners
        # run steps as the unprivileged `runner` user; only the container
        # and the scratch directory use sudo. Never run the cargo steps of
        # this job under sudo.
        run: |
          uid="$(id -u)"
          if [ "$uid" -eq 0 ]; then
            echo "::error::pg-integration runs as root (uid 0); the admin-key rule cannot be tested"
            exit 1
          fi
          echo "ok: tests run as $(id -un) (uid $uid)"
      - uses: ./.github/actions/fips-toolchain
      - name: Install Rust from rust-toolchain.toml
        run: rustup toolchain install && rustup show
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: pg-integration-${{ runner.os }}-go${{ env.EXPECT_GO }}-cmake${{ env.EXPECT_CMAKE }}-clang${{ env.EXPECT_CLANG }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Build the pg-integration tests
        run: cargo test --workspace --locked --features pg-integration --no-run
      - name: Without the database variables the pg tests fail, not skip
        run: |
          set -uo pipefail
          if env | grep -q '^USGP_TEST_PG_'; then
            echo "::error::USGP_TEST_PG_* is already set; this step must run without it"
            exit 1
          fi
          bad=0
          for entry in $PG_REQUIRED_TESTS; do
            pkg="${entry%%:*}"
            t="${entry#*:}"
            log="$RUNNER_TEMP/no-db-$t.log"
            status=0
            cargo test -p "$pkg" --locked --features pg-integration --test "$t" > "$log" 2>&1 || status=$?
            if [ "$status" -ne 0 ] && grep -q '^test result: FAILED' "$log"; then
              echo "ok: $pkg $t fails without a database (exit $status)"
            else
              echo "::error::$pkg $t exited $status without a database; it must run and fail (plan WU-3b)"
              tail -n 40 "$log"
              bad=1
            fi
          done
          exit "$bad"
      - name: Start PostgreSQL 16 (TLS, certificate-only login, checked)
        id: pg
        run: |
          set -euo pipefail
          scripts/pg-test-setup.sh up 2>&1 | tee "$RUNNER_TEMP/pg-setup.log"
          # Decision 0016: the admin role's login material must be exported
          # with the owner's and the application role's.
          for v in USGP_TEST_PG_ADMIN_USER USGP_TEST_PG_ADMIN_CERT USGP_TEST_PG_ADMIN_KEY; do
            grep -q "^$v=" "$RUNNER_TEMP/usgp-pg-test/pg-test.env" \
              || { echo "::error::$v missing from pg-test.env"; exit 1; }
          done
          cat "$RUNNER_TEMP/usgp-pg-test/pg-test.env" >> "$GITHUB_ENV"
          {
            echo '### PostgreSQL for pg-integration'
            echo '```text'
            cat "$RUNNER_TEMP/pg-setup.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: pg-integration tests
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/pg-tests.log"
          status=0
          cargo test --workspace --locked --features pg-integration 2>&1 | tee "$log" || status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::cargo test --features pg-integration exited $status"
            exit 1
          fi
          # A green run must include every required test binary, each with
          # at least one passing test and none ignored.
          bad=0
          for entry in $PG_REQUIRED_TESTS; do
            t="${entry#*:}"
            line="$(sed 's/\x1b\[[0-9;]*m//g' "$log" | awk -v t="tests/$t.rs" '$1 == "Running" && $2 == t { f = 1; next } f && /^test result:/ { print; exit }')"
            passed="$(echo "$line" | sed -n 's/.* \([0-9][0-9]*\) passed;.*/\1/p')"
            ignored="$(echo "$line" | sed -n 's/.*; \([0-9][0-9]*\) ignored;.*/\1/p')"
            if [ -z "$line" ] || [ "${passed:-0}" -eq 0 ] || [ "${ignored:-1}" -ne 0 ]; then
              echo "::error::$entry did not run as required (result: '${line:-none}')"
              bad=1
            else
              echo "ok: $entry: $line"
            fi
          done
          exit "$bad"
      - name: Re-check the database configuration after the tests (decision 0012)
        if: ${{ !cancelled() && steps.pg.outcome == 'success' }}
        run: scripts/pg-test-setup.sh check
      - name: PostgreSQL server log (on failure)
        if: ${{ failure() && steps.pg.outcome != 'skipped' }}
        run: docker logs usgp-pg-test 2>&1 | tail -n 200 || true
      - name: Remove the container and the test keys
        if: ${{ always() }}
        run: scripts/pg-test-setup.sh down

  large-upload:
    # Plan WU-10 and section 10 "Large": the M2 exit-1 flow on a synthetic
    # 10.5 GiB, 12-image WIM against PostgreSQL (upload, check, editions,
    # declaration, PE import, package Ready, signed manifests, verified
    # re-download, RSS bound). Scheduled and manual only: it needs about
    # 14 GiB of disk and a long run, so it does not run on every push.
    #
    # Result rule: NOT RUN (test file missing, too little disk, or the
    # test's own NOT RUN marker) fails this job with a "large-upload NOT
    # RUN" annotation. It is never reported as PASS.
    #
    # COMPLIANCE MAPPING:
    # - NIST 800-53: SI-7 (integrity on upload and re-download), SC-5
    #   (bounded memory on large bodies), AU-9, SA-11
    # - Plan WU-10; decisions 0008, 0011, 0012
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      LARGE_MIN_FREE_GIB: "14"
      # The failure message large_upload_pg.rs starts with when the only
      # problem is disk space (its NOT_RUN_DISK constant). Any other failure
      # is FAIL; a run that passes no test is also NOT RUN.
      LARGE_NOT_RUN_MARKER: "NOT RUN: insufficient disk"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require the large upload test (absent is NOT RUN, which fails)
        # Also requires a non-root user, as pg-integration does (SEC-011:
        # root can open the 0000 admin key, so `serve` would refuse).
        run: |
          if [ "$(id -u)" -eq 0 ]; then
            echo "::error::large-upload runs as root (uid 0); the admin-key rule cannot be tested"
            exit 1
          fi
          if [ ! -f services/usgp-server/tests/large_upload_pg.rs ]; then
            echo "::error title=large-upload NOT RUN::services/usgp-server/tests/large_upload_pg.rs does not exist yet (plan WU-10). The large upload did not run. This is not a PASS."
            exit 1
          fi
      - name: Free-disk preflight (too little space is NOT RUN, which fails)
        # Content root: the larger of the $RUNNER_TEMP file system and /mnt
        # (plan WU-10). Exported as TMPDIR, where the test puts its source
        # image and the server's content root, and checks free space.
        id: disk
        run: |
          set -euo pipefail
          free_gib() { df -P -k "$1" | awk 'NR == 2 { printf "%d", $4 / 1048576 }'; }
          df -h "$RUNNER_TEMP" /mnt 2> /dev/null || true
          root_free="$(free_gib "$RUNNER_TEMP")"
          mnt_free=0
          if [ -d /mnt ]; then mnt_free="$(free_gib /mnt)"; fi
          if [ "$mnt_free" -gt "$root_free" ]; then
            dir=/mnt/usgp-large
            sudo install -d -o "$(id -u)" -g "$(id -g)" -m 0700 "$dir"
            free="$mnt_free"
          else
            dir="$RUNNER_TEMP/usgp-large"
            install -d -m 0700 "$dir"
            free="$root_free"
          fi
          echo "content root $dir: $free GiB free (need $LARGE_MIN_FREE_GIB GiB)"
          if [ "$free" -lt "$LARGE_MIN_FREE_GIB" ]; then
            echo "::error title=large-upload NOT RUN::$free GiB free under $dir, $LARGE_MIN_FREE_GIB GiB needed. The large upload did not run. This is not a PASS."
            exit 1
          fi
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "TMPDIR=$dir" >> "$GITHUB_ENV"
      - uses: ./.github/actions/fips-toolchain
      - name: Install Rust from rust-toolchain.toml
        run: rustup toolchain install && rustup show
      # Registry only: a cached release target/ would take the disk the
      # test needs when the content root shares the root file system.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: large-upload-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Build the large upload test (release)
        run: cargo test -p usgp-server --release --locked --features pg-integration,large-tests --test large_upload_pg --no-run
      - name: Re-check free disk after the build
        env:
          CONTENT_DIR: ${{ steps.disk.outputs.dir }}
        run: |
          set -euo pipefail
          free="$(df -P -k "$CONTENT_DIR" | awk 'NR == 2 { printf "%d", $4 / 1048576 }')"
          echo "content root $CONTENT_DIR: $free GiB free after the build"
          if [ "$free" -lt "$LARGE_MIN_FREE_GIB" ]; then
            echo "::error title=large-upload NOT RUN::$free GiB free under $CONTENT_DIR after the build, $LARGE_MIN_FREE_GIB GiB needed. The large upload did not run. This is not a PASS."
            exit 1
          fi
      - name: Start PostgreSQL 16 (TLS, certificate-only login, checked)
        id: pg
        run: |
          set -euo pipefail
          scripts/pg-test-setup.sh up 2>&1 | tee "$RUNNER_TEMP/pg-setup.log"
          # Decision 0016: the admin role's login material (large_upload_pg
          # enrols the operator and verifies the audit chain as usgp_admin).
          for v in USGP_TEST_PG_ADMIN_USER USGP_TEST_PG_ADMIN_CERT USGP_TEST_PG_ADMIN_KEY; do
            grep -q "^$v=" "$RUNNER_TEMP/usgp-pg-test/pg-test.env" \
              || { echo "::error::$v missing from pg-test.env"; exit 1; }
          done
          cat "$RUNNER_TEMP/usgp-pg-test/pg-test.env" >> "$GITHUB_ENV"
      - name: Large upload test (exit-1 flow; NOT RUN is never PASS)
        timeout-minutes: 180
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/large-upload.log"
          status=0
          cargo test -p usgp-server --release --locked --features pg-integration,large-tests \
            --test large_upload_pg -- --nocapture 2>&1 | tee "$log" || status=$?
          line="$(sed 's/\x1b\[[0-9;]*m//g' "$log" | awk '$1 == "Running" && $2 == "tests/large_upload_pg.rs" { f = 1; next } f && /^test result:/ { print; exit }')"
          passed="$(echo "$line" | sed -n 's/.* \([0-9][0-9]*\) passed;.*/\1/p')"
          ignored="$(echo "$line" | sed -n 's/.*; \([0-9][0-9]*\) ignored;.*/\1/p')"
          {
            echo '### large-upload result'
            echo '```text'
            echo "exit $status; ${line:-no test result line}"
            df -h "$TMPDIR" | tail -n 1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if grep -qF -- "$LARGE_NOT_RUN_MARKER" "$log"; then
            echo "::error title=large-upload NOT RUN::the test reported NOT RUN ($LARGE_NOT_RUN_MARKER). This is not a PASS."
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            echo "::error title=large-upload FAIL::cargo test exited $status"
            exit 1
          fi
          if [ -z "$line" ] || [ "${passed:-0}" -eq 0 ] || [ "${ignored:-1}" -ne 0 ]; then
            echo "::error title=large-upload NOT RUN::large_upload_pg did not pass a test (result: '${line:-none}'). This is not a PASS."
            exit 1
          fi
          echo "large-upload: PASS ($line)"
      - name: Re-check the database configuration after the test (decision 0012)
        if: ${{ !cancelled() && steps.pg.outcome == 'success' }}
        run: scripts/pg-test-setup.sh check
      - name: PostgreSQL server log (on failure)
        if: ${{ failure() && steps.pg.outcome != 'skipped' }}
        run: docker logs usgp-pg-test 2>&1 | tail -n 200 || true
      - name: Remove the container, the test keys and the content root
        if: ${{ always() }}
        env:
          CONTENT_DIR: ${{ steps.disk.outputs.dir }}
        run: |
          scripts/pg-test-setup.sh down || true
          if [ -n "$CONTENT_DIR" ]; then
            rm -rf -- "$CONTENT_DIR" 2> /dev/null || sudo rm -rf -- "$CONTENT_DIR"
          fi

  markdown:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Node and npm come with the runner image (not pinned; REL-008).
      # markdownlint-cli 0.45.0 and every transitive dependency are pinned
      # with integrity hashes in .github/markdownlint/package-lock.json.
      - name: Install markdownlint from the lockfile (REL-008)
        working-directory: .github/markdownlint
        run: npm ci --ignore-scripts --no-audit --no-fund
      - run: .github/markdownlint/node_modules/.bin/markdownlint --version
      - run: >-
          .github/markdownlint/node_modules/.bin/markdownlint "docs/**/*.md" "specs/**/*.md"
          "fuzz/*.md" "fuzz/corpus/**/*.md" "testing/**/*.md" "*.md"

  ci-lint:
    # shellcheck for scripts/ (includes boot-smoke.sh and gates.sh),
    # actionlint for workflows (REL-008).
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SHELLCHECK_VERSION: "0.9.0"
      ACTIONLINT_VERSION: "1.7.7"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install shellcheck (noble archive, version asserted)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
          got="$(shellcheck --version | sed -n 's/^version: //p')"
          [ "$got" = "$SHELLCHECK_VERSION" ] || { echo "::error::shellcheck is $got, expected $SHELLCHECK_VERSION"; exit 1; }
      - name: Install actionlint (Go module, checksums verified by sum.golang.org)
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install "github.com/rhysd/actionlint/cmd/actionlint@v${ACTIONLINT_VERSION}"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: shellcheck scripts/*.sh
      - run: actionlint -version && actionlint

  fuzz-build:
    # Separate workspace; libFuzzer allowed only here (decision 0002).
    # Build output is target/fuzz (fuzz/.cargo/config.toml, decision 0005).
    # Since M2 the fuzz workspace links usgp-crypto (through usgp-image and
    # usgp-proto), so it builds the AWS-LC FIPS module and needs the pinned
    # FIPS toolchain like every other job that builds usgp-crypto.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/fips-toolchain
      - name: Install pinned nightly from fuzz/rust-toolchain.toml
        working-directory: fuzz
        run: rustup toolchain install && rustup show
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-fuzz
            ~/.cargo/registry
            target/fuzz
          key: fuzz-${{ runner.os }}-cargo-fuzz-0.13.2-go${{ env.EXPECT_GO }}-cmake${{ env.EXPECT_CMAKE }}-clang${{ env.EXPECT_CLANG }}-${{ hashFiles('fuzz/Cargo.toml', 'fuzz/Cargo.lock', 'fuzz/rust-toolchain.toml', 'fuzz/.cargo/config.toml') }}
      - name: Install cargo-fuzz
        run: command -v cargo-fuzz || cargo install --locked cargo-fuzz@0.13.2
      - name: Check fuzz/Cargo.lock is up to date (REL-008)
        working-directory: fuzz
        run: cargo fetch --locked
      - name: Format and lint with the pinned nightly
        working-directory: fuzz
        run: |
          cargo fmt --all --check
          cargo clippy --locked --all-targets -- -D warnings
      - name: Build fuzz targets
        working-directory: fuzz
        # --sanitizer none on Linux: AWS-LC FIPS (linked through usgp-crypto)
        # cannot be built with AddressSanitizer, because its delocate step
        # rejects ASan's GOTPCREL code (CI run 40599553698). libFuzzer
        # coverage, panic, timeout and RSS-limit detection are unchanged;
        # every fuzzed crate forbids unsafe code. Local macOS gates keep
        # ASan. Build and run must use the same flag, or run rebuilds.
        run: cargo fuzz build --sanitizer none
      - name: Replay the committed seeds (regression, no new inputs)
        # Every target in fuzz/fuzz_targets/ must be listed here; a target
        # without a replay fails this step.
        working-directory: fuzz
        run: |
          set -euo pipefail
          targets="dhcp_packet tftp_packet wim_header wim_xml wim_lookup wim_check xpress_chunk api_json"
          for f in fuzz_targets/*.rs; do
            t="$(basename "$f" .rs)"
            case " $targets " in
              *" $t "*) ;;
              *) echo "::error::fuzz target $t has no seed replay in ci.yml"; exit 1 ;;
            esac
          done
          for t in $targets; do
            cargo fuzz run --sanitizer none "$t" "corpus/$t" -- -runs=0 -rss_limit_mb=2048 -timeout=10
          done

  fuzz-smoke:
    # Each target runs for its plan length with no crash, OOM or timeout:
    # M1 exit criterion 3 (dhcp_packet, tftp_packet, 600 s) and M2 plan
    # section 10 (wim_header, wim_xml, xpress_chunk 600 s; wim_lookup,
    # wim_check, api_json 60 s smoke), all with -rss_limit_mb=2048
    # -timeout=10 (impl-notes-wu9). Scheduled and manual only; fuzz-build
    # replays the seeds on every change. Each matrix job builds the FIPS
    # module too, hence the toolchain step and the longer timeout.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # -max_len lets the DHCP fuzzer reach the over-length (> 1472 octet)
          # path; TFTP transfer scripts need more room (impl-notes-wu8). The
          # M2 lengths are from impl-notes-wu9 (wim_check seeds reach 213 KB).
          - target: dhcp_packet
            max_len: 1600
            secs: 600
          - target: tftp_packet
            max_len: 4096
            secs: 600
          - target: wim_header
            max_len: 1024
            secs: 600
          - target: wim_xml
            max_len: 16384
            secs: 600
          - target: xpress_chunk
            max_len: 70000
            secs: 600
          - target: wim_lookup
            max_len: 4096
            secs: 60
          - target: wim_check
            max_len: 262144
            secs: 60
          - target: api_json
            max_len: 70000
            secs: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/fips-toolchain
      - name: Install pinned nightly from fuzz/rust-toolchain.toml
        working-directory: fuzz
        run: rustup toolchain install && rustup show
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-fuzz
            ~/.cargo/registry
            target/fuzz
          key: fuzz-${{ runner.os }}-cargo-fuzz-0.13.2-go${{ env.EXPECT_GO }}-cmake${{ env.EXPECT_CMAKE }}-clang${{ env.EXPECT_CLANG }}-${{ hashFiles('fuzz/Cargo.toml', 'fuzz/Cargo.lock', 'fuzz/rust-toolchain.toml', 'fuzz/.cargo/config.toml') }}
      - name: Install cargo-fuzz
        run: command -v cargo-fuzz || cargo install --locked cargo-fuzz@0.13.2
      - name: Fuzz ${{ matrix.target }} for ${{ matrix.secs }} s
        working-directory: fuzz
        env:
          TARGET: ${{ matrix.target }}
          MAX_LEN: ${{ matrix.max_len }}
          RUN_SECS: ${{ matrix.secs }}
        run: |
          set -euo pipefail
          cargo fetch --locked
          mkdir -p "artifacts/$TARGET" "$RUNNER_TEMP/work/$TARGET"
          # Scratch working corpus first, so new inputs (no recorded origin)
          # never land in fuzz/corpus/ (CONTRIBUTING.md test-data rule).
          cargo fuzz run --sanitizer none "$TARGET" "$RUNNER_TEMP/work/$TARGET" "corpus/$TARGET" -- \
            -max_total_time="$RUN_SECS" -max_len="$MAX_LEN" -rss_limit_mb=2048 -timeout=10 \
            -print_final_stats=1 \
            2>&1 | tee "artifacts/$TARGET/fuzz.log"
          # libFuzzer exits 0 when time runs out. Require the full run
          # length, so an early stop is never reported as a pass.
          secs="$(sed -n 's/^Done [0-9]* runs in \([0-9]*\) second.*/\1/p' "artifacts/$TARGET/fuzz.log" | tail -n 1)"
          if [ -z "$secs" ] || [ "$secs" -lt "$RUN_SECS" ]; then
            echo "::error::$TARGET ran ${secs:-unknown} s, expected at least $RUN_SECS s"
            exit 1
          fi
          {
            echo "### fuzz-smoke $TARGET ($RUN_SECS s, -max_len=$MAX_LEN)"
            echo '```text'
            grep -E '^(Done|stat::)' "artifacts/$TARGET/fuzz.log" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload fuzz log and any crash, OOM or timeout inputs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-smoke-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: warn
          retention-days: 30

  boot-smoke:
    # M1 exits 1, 2 (in QEMU), 4 (binding) and 5 (plan section 10.5; owner
    # approval Q-5). Linux with root: network namespaces, bridges and taps.
    # Exit 0 is PASS; 1 is FAIL; 77 is NOT RUN and fails this job (see the
    # result rule at the top of this file).
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/fips-toolchain
        with:
          extra-packages: qemu-system-x86 ovmf iproute2
      - name: Install Rust (product and testing toolchain files)
        run: |
          set -euo pipefail
          rustup toolchain install && rustup show
          (cd testing/uefi-payload && rustup toolchain install)
          (cd testing/netlab && rustup toolchain install)
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release
            target/testing
          key: boot-smoke-${{ runner.os }}-go${{ env.EXPECT_GO }}-cmake${{ env.EXPECT_CMAKE }}-clang${{ env.EXPECT_CLANG }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'testing/*/Cargo.lock', 'testing/*/rust-toolchain.toml') }}
      - name: Enable KVM for the runner user when /dev/kvm exists
        run: |
          set -euo pipefail
          if [ -e /dev/kvm ]; then
            # Ephemeral runner VM: the QEMU user ($SUDO_USER) needs /dev/kvm.
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
              | sudo tee /etc/udev/rules.d/99-usgp-kvm.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
            ls -l /dev/kvm
          else
            echo "::warning::/dev/kvm not present; the harness falls back to TCG (longer deadlines)"
          fi
      - name: Record and check the lab packages and firmware files
        # The harness defaults are the Ubuntu ovmf package paths (plan
        # section 10.5). A missing file is configuration drift: fail here
        # instead of letting the harness report NOT RUN.
        run: |
          set -euo pipefail
          fw="/usr/share/OVMF/OVMF_CODE_4M.fd /usr/share/OVMF/OVMF_VARS_4M.fd /usr/share/OVMF/OVMF_CODE_4M.secboot.fd /usr/share/OVMF/OVMF_VARS_4M.ms.fd"
          {
            echo '### Boot smoke environment'
            echo '```text'
            dpkg-query -W qemu-system-x86 ovmf iproute2
            qemu-system-x86_64 --version | head -n 1
            for f in $fw; do
              if [ -f "$f" ]; then sha256sum "$f"; else echo "MISSING $f"; fi
            done
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          for f in $fw; do
            [ -f "$f" ] || { echo "::error::firmware file $f not installed by the ovmf package"; exit 1; }
          done
      - name: Build relay, cli, netlab and payloads (as the runner user)
        run: scripts/boot-smoke.sh build
      - name: Boot smoke (root; exit 77 is NOT RUN, never PASS)
        timeout-minutes: 90
        env:
          USGP_BOOT_SMOKE_OUT: ${{ github.workspace }}/target/boot-smoke/ci-run
        run: |
          set -uo pipefail
          status=0
          # -E keeps USGP_*; sudo sets SUDO_USER, which becomes the QEMU user.
          sudo -E scripts/boot-smoke.sh all 2>&1 | tee target/boot-smoke/console.log || status=$?
          {
            echo '### Boot smoke result'
            echo '```text'
            sed -n '/boot-smoke summary/,$p' target/boot-smoke/console.log
            echo "exit $status"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          case "$status" in
            0) echo "boot-smoke: PASS (every scenario passed)" ;;
            77)
              echo "::error title=boot-smoke NOT RUN::exit 77: no scenario failed, but at least one was NOT RUN. This is not a PASS; see the job summary and the boot-smoke-evidence artifact."
              exit 1
              ;;
            1)
              echo "::error title=boot-smoke FAIL::at least one scenario (or preflight) failed; see the boot-smoke-evidence artifact."
              exit 1
              ;;
            *)
              echo "::error title=boot-smoke error::harness exited $status"
              exit 1
              ;;
          esac
      - name: Name scan of the release binaries, payloads and evidence (CR-303)
        # Runs even when the boot smoke failed, so the evidence can still be
        # uploaded. No exclusions; exit 1 on a hit, exit 2 if an artifact is
        # missing or unreadable.
        id: artifact-names
        if: ${{ !cancelled() }}
        run: scripts/check-artifact-names.sh
      - name: Upload boot smoke evidence (serial logs, relay JSON logs, summary)
        # Only after a clean name scan: nothing that fails the clean-room name
        # rule leaves the runner (CR-303). The job log keeps the scan output.
        if: ${{ !cancelled() && steps.artifact-names.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: boot-smoke-evidence
          path: target/boot-smoke/
          if-no-files-found: warn
          retention-days: 30
