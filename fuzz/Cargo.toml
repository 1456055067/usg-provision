# Separate, unshipped workspace for cargo-fuzz targets.
# libfuzzer-sys (C++ libFuzzer) is allowed here only: docs/decisions/0002.
[package]
name = "usgp-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]
members = ["."]

[dependencies]
libfuzzer-sys = "0.4"
usgp-dhcp = { path = "../crates/usgp-dhcp" }
usgp-tftp = { path = "../crates/usgp-tftp" }

[[bin]]
name = "dhcp_packet"
path = "fuzz_targets/dhcp_packet.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tftp_packet"
path = "fuzz_targets/tftp_packet.rs"
test = false
doc = false
bench = false

# Seed generator for fuzz/corpus/ (see fuzz/corpus/*/SOURCE.md). Pure
# Rust; it does not use libfuzzer-sys.
[[example]]
name = "gen_seeds"
path = "examples/gen_seeds.rs"
