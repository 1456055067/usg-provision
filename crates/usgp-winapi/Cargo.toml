[package]
name = "usgp-winapi"
description = "Windows API wrappers for the pre-boot agent (the only crate with unsafe FFI; decision 0019)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Decision 0019: windows-sys (declarations only, raw-dylib through
# windows-link, no C) is used by this crate only; deny.toml enforces it.
# On other targets the crate is empty.
[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true
# Only for the tree_manifest example (SHA-256 through the FIPS provider,
# decision 0001). Optional, so the agent's use of this crate never pulls it.
usgp-crypto = { workspace = true, optional = true }
# The ApplySink trait for WinSink (feature `sink`). Optional: usgp-image
# brings usgp-crypto's FIPS C build, which cannot be cross-built from macOS,
# so the rest of the crate stays checkable for the Windows target there.
usgp-image = { workspace = true, optional = true }

[features]
# Builds examples/tree_manifest.rs (plan WU-5; S16 and the fidelity check).
manifest-tool = ["dep:usgp-crypto"]
# WinSink (src/winsink.rs). The pre-boot agent enables it.
sink = ["dep:usgp-image"]
# tests/winsink.rs: the synthetic-WIM builder and SHA-256 for the manifest.
# Tests only; never enabled by a release build.
sink-testkit = ["sink", "manifest-tool", "usgp-image/testkit"]

[[example]]
name = "tree_manifest"
required-features = ["manifest-tool"]

[[test]]
name = "winsink"
required-features = ["sink-testkit"]

# A copy of the workspace lints with one change: `unsafe_code` is "deny", not
# "forbid", so that src/ffi.rs alone can allow it (decision 0019 item 2).
# scripts/check-pure-rust.sh fails if any other file allows `unsafe_code`.
# Keep the rest in step with [workspace.lints] in the root Cargo.toml.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
mem_forget = "deny"
undocumented_unsafe_blocks = "deny"
